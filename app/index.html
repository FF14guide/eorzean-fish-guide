/* ══════════════════════════════════════════════════════════
   オーシャンフィッシング
   便は UTC の2時間ちょうどごとに出る。144便で12日かけて一周し、
   どの便がどの航路かはゲームの運行表から決まる。
   ══════════════════════════════════════════════════════════ */
const VOYAGE_SEC = 7200;
const chunkOf = (ms) => Math.floor(ms / 1000 / VOYAGE_SEC);
const voyageAt = (chunk) => {
  const [i, r] = DB.ocean.table[(chunk + DB.ocean.phase) % DB.ocean.table.length];
  return { indigo: DB.ocean.routes[i], ruby: DB.ocean.routes[r] };
};

// 時間帯コード 1=夜 2=昼 3=夕
const TIME_KEY = { 1: 'night', 2: 'day', 3: 'sunset' };
const TIME_CLS = { 1: 'tn', 2: 'td', 3: 'ts' };
const timeLabel = (t) => T(TIME_KEY[t] ?? 'day');

function stopsHTML(route) {
  if (!route) return '<span class="odim">—</span>';
  // 幻海流に入ると釣れる魚がまるごと入れ替わるので、寄港地ごとに両方へ行けるようにする
  return route.stops.map((st) => `<span class="ostopwrap">
    <span class="ostop${st.spotId ? '' : ' plain'}" ${st.spotId ? `data-spot="${st.spotId}"` : ''}
      title="${T('normal')}">${esc(nm(st.n))}<i class="${TIME_CLS[st.time] ?? 'td'}">${timeLabel(st.time)}</i></span>
    ${st.subSpotId ? `<span class="ospec" data-spot="${st.subSpotId}" title="${T('spectral')}">${state.lang === 'ja' ? '幻' : 'S'}</span>` : ''}
  </span>`).join('<span class="oarrow">→</span>');
}

/**
 * その便で狙える魚。寄港地の時間帯と、魚が要求する時間帯が合ったものだけ。
 * 幻海流の魚は幻海流の釣り場から拾う。
 */
function voyageTargets(route) {
  if (!route) return { legend: [], timed: [] };
  const legend = [], timed = [];
  for (const st of route.stops) {
    for (const sid of [st.spotId, st.subSpotId]) {
      const sp = sid != null ? spotById.get(sid) : null;
      if (!sp) continue;
      for (const id of sp.fishes) {
        const f = DB.fish[id];
        if (!f) continue;
        // 時間指定のある魚は、その寄港地の時間帯と一致するときだけ狙える
        if (f.oceanTimes && !f.oceanTimes.includes(st.time)) continue;
        if (f.oceanLegend) legend.push({ f, sp, st });
        else if (f.oceanTimes) timed.push({ f, sp, st });
      }
    }
  }
  return { legend, timed };
}

function targetChips(route) {
  const { legend, timed } = voyageTargets(route);
  if (!legend.length && !timed.length) return '';
  const chip = (x, cls) => {
    const b = baitPathByRate(x.f.id, x.sp.id);
    const label = b ? b.path.map(baitName).join(' ▸ ') : '';
    return `<span class="otgt ${cls}" data-fish="${x.f.id}" data-fishspot="${x.sp.id}"
      title="${esc(nm(x.sp.n))} / ${timeLabel(x.st.time)}${b ? ` / ${esc(label)} ${b.rate}%` : ''}">
      ${esc(nm(x.f.n))}${b ? `<i>${esc(label)}</i>` : ''}</span>`;
  };
  return `<div class="otargets">
    ${legend.map((x) => chip(x, 'legend')).join('')}
    ${timed.map((x) => chip(x, 'timed')).join('')}
  </div>`;
}

function renderOcean() {
  const now = Date.now();
  const cur = chunkOf(now);
  const dests = [];
  for (const r of Object.values(DB.ocean.routes)) if (!dests.some((d) => d.ja === r.dest.ja)) dests.push(r.dest);
  const rows = [];
  for (let i = 0; i < 24; i++) {
    const c = cur + i;
    const dep = c * VOYAGE_SEC * 1000;
    const v = voyageAt(c);
    if (state.oceanDest !== 'all' &&
        v.indigo?.dest.ja !== state.oceanDest && v.ruby?.dest.ja !== state.oceanDest) continue;
    if (state.oceanLegendOnly &&
        !voyageTargets(v.indigo).legend.length && !voyageTargets(v.ruby).legend.length) continue;
    rows.push({ c, dep, v, boarding: now >= dep && now < dep + 15 * 60000 });
  }

  $('#stage').innerHTML = `<div class="wrap">
    <div class="spot-head">
      <h1>オーシャンフィッシング</h1>
      <div class="meta">2時間ごとに出航 · 144便で12日かけて一周</div>
    </div>
    <div class="eyebrow">OCEAN FISHING — VOYAGE SCHEDULE</div>

    <div class="toolbar" style="margin-top:18px">
      <button class="chipbtn" data-od="all" aria-pressed="${state.oceanDest === 'all'}">${T('all')}</button>
      ${dests.map((d) => `<button class="chipbtn" data-od="${esc(d.ja)}"
        aria-pressed="${state.oceanDest === d.ja}">${esc(nm(d))}</button>`).join('')}
      <span style="width:10px"></span>
      <button class="chipbtn" data-ot="1" aria-pressed="${state.oceanTargets}">${T('targets')}</button>
      <button class="chipbtn" data-ol="1" aria-pressed="${state.oceanLegendOnly}">${T('legendOnly')}</button>
    </div>

    <div class="ohead">
      <div>${T('depart')}</div><div>${T('indigoRoute')}</div><div>${T('rubyRoute')}</div>
    </div>
    <div>${rows.map(({ dep, v, boarding }) => `
      <div class="orow${boarding ? ' now' : ''}">
        <div class="otime">
          <b>${dayLabel(dep)}${hhmm(dep)}</b>
          <span>${boarding ? T('boarding') : relTime(dep)}</span>
        </div>
        <div class="oroute">
          <div class="oname indigo">${esc(nm(v.indigo?.n)) || '—'}
            <em>${v.indigo ? esc(timeLabel(v.indigo.destTime)) : ''}</em></div>
          <div class="opath">${stopsHTML(v.indigo)}</div>
          ${state.oceanTargets ? targetChips(v.indigo) : ''}
        </div>
        <div class="oroute">
          <div class="oname ruby">${esc(nm(v.ruby?.n)) || '—'}
            <em>${v.ruby ? esc(timeLabel(v.ruby.destTime)) : ''}</em></div>
          <div class="opath">${stopsHTML(v.ruby)}</div>
          ${state.oceanTargets ? targetChips(v.ruby) : ''}
        </div>
      </div>`).join('') || `<div class="gempty" style="padding:26px 12px">${state.lang === 'ja' ? 'この行き先の便は48時間以内にありません。' : 'No voyage to this destination within 48 hours.'}</div>`}
    </div>

    <div class="credit" style="margin-top:24px;border-top:none;padding-top:0">
      行き先をクリックすると、その海域の魚とヒットタイムが見られます（幻海流は別の釣り場として収録）。<br>
      運行位相はゲームの運行表と、コミュニティの独立した2実装を突き合わせて確定したもの。
    </div>
    ${creditHTML()}
  </div>`;
  $('#stage').scrollTop = 0;
}

/* ══════════════════════════════════════════════════════════
   魚の詳細ドロワー
   ══════════════════════════════════════════════════════════ */
function openFish(fishId, fromSpotId) {
  const f = DB.fish[fishId];
  if (!f) return;
  const spot = spotById.get(fromSpotId ?? f.spots[0]);
  const terr = spot?.territoryId ?? null;

  const wsRaw = f.nushi ? nushiWindows(f, terr) : findWindows(f, terr, { days: 3, limit: 8, fishEyes: state.fishEyes });
  const ws = wsRaw === 'always' ? [] : wsRaw;
  const always = wsRaw === 'always';
  const winHTML = always
    ? '<p style="color:var(--glow);font-size:12.5px">時間帯・天候の制約なし。いつ行っても抽選対象。</p>'
    : ws.length ? ws.map(([a, b], i) => `
    <div class="win${i === 0 && a <= Date.now() ? ' active' : ''}">
      <time>${dayLabel(a)}${hhmm(a)} – ${dayLabel(b)}${hhmm(b)}</time>
      <span class="dur">${fmtMin(mins(a, b))}</span></div>`).join('')
    : '<p style="color:var(--dim);font-size:12px">72時間以内にウィンドウなし、または条件が未判明です。</p>';

  // ヒットタイム：この釣り場でのエサ別実測
  const bites = (spot && biteIndex.get(spot.id)?.get(f.id)) ?? [];
  const key = `${spot?.id ?? 0}:${f.id}:${baitKey(f.baitPath[f.baitPath.length - 1]) ?? 0}`;
  const snippet = `"${key}": { "lo": 0, "hi": 0, "n": 1 }`;

  const biteSec = bites.length ? `
    <table class="btab">
      <thead><tr><th>${T('baitCol')}</th><th>${T('biteSec')}</th><th>${T('chumCol')}</th><th>${T('rate')}</th><th>${T('samples')}</th></tr></thead>
      <tbody>${(() => {
      const hs = bites.map((b) => unpackHist(b.h));
      const dmax = Math.ceil(Math.max(20, ...bites.map((b) => b.hi ?? 0),
        ...hs.map((h) => (h ? (h.start + h.v.length) * HIST_BIN : 0))) / 5) * 5;
      return bites.map((b, bi) => {
        const h = hs[bi];
        return `<tr>
          <td>${esc(baitName(b.baitId))}</td>
          <td class="num"><b>${b.lo ?? '—'}${b.hi != null ? '–' + b.hi : ''}</b>${b.lo != null ? '<span class="unit">s</span>' : ''}
            ${h ? `<svg class="spark" viewBox="0 0 350 24" preserveAspectRatio="none"><path d="${histPath(h, dmax)}" fill="currentColor" opacity=".55"/></svg>` : ''}</td>
          <td class="num">${b.clo != null ? `${b.clo}–${b.chi}<span class="unit">s</span>` : '—'}</td>
          <td class="num">${b.rate != null ? b.rate + '%' : '—'}</td>
          <td class="num dim">${b.n}</td>
        </tr>`;
      }).join(''); })()}</tbody>
    </table>
    <p class="bnote" style="margin-top:8px">秒数は撒き餌なしの実測レンジ。装備の獲得力によって上限は伸びる。</p>`
    : `<div class="report">
        <p>この釣り場での実測はまだありません。<code style="display:inline;padding:0 3px">node tools/import-bite-times.mjs</code> で取り込むか、実測を <code style="display:inline;padding:0 3px">data/bite-times.json</code> に足してください。</p>
        <code>${esc(snippet)}</code>
        <button type="button" id="copykey">スニペットをコピー</button>
      </div>`;

  $('#drawer').innerHTML = `
    <header>
      <button class="close" aria-label="閉じる">×</button>
      <div class="dhead">
        ${iconImg(f, 'ficon lg')}
        <div style="min-width:0">
          <h2>${esc(nm(f.n))}</h2>
          <div class="eyebrow" style="margin-top:3px">${esc(f.n.en)}</div>
        </div>
        ${f.nushi ? `<button class="fav big" data-fav="${f.id}" aria-pressed="${state.favs.has(f.id)}"
          title="★">${state.favs.has(f.id) ? '★' : '☆'}</button>` : ''}
      </div>
      ${f.desc ? `<p class="ddesc">${esc(f.desc[state.lang] ?? f.desc.en ?? f.desc.ja)}</p>` : ''}
    </header>
    <div class="dbody">
      <div class="dsec">
        <span class="eyebrow">${T('howTo')}</span>
        <dl class="kv">
          <dt>${T('bait')}</dt><dd>${(() => {
            if (f.baitPath.length) return f.baitPath.map(baitName).map(esc).join(' ▸ ');
            const b = spot ? baitPathByRate(f.id, spot.id) : null;
            if (!b) return '—';
            return `${b.path.map(baitName).map(esc).join(' ▸ ')}
              <span style="color:var(--dim);font-size:11px">${b.rate}% · ${b.swimOnly ? T('swimOnly') : T('byRate')}</span>`;
          })()}</dd>
          ${f.predators.length ? `<dt>${T('intuition')}</dt><dd>${f.predators.map(([id, n]) =>
            `${esc(nm(DB.fish[id]?.n) || baitName(id))} ×${n}`).join(' + ')}${f.intuition ? `（${f.intuition}s）` : ''}</dd>` : ''}
          <dt>${T('hours')}</dt><dd>${!f.hasConditions ? T('unknown') : (f.startHour === 0 && f.endHour === 24 ? T('allDay') : `ET ${etLabel(f.startHour)} – ${etLabel(f.endHour)}`)}</dd>
          <dt>${T('weather')}</dt><dd>${!f.hasConditions ? T('unknown')
            : (f.weather.length ? f.weather.map((w) => wIcon(w) + esc(wName(w))).join(' / ') : T('anyWeather'))}
            ${f.prevWeather.length ? `<br><span style="color:var(--mist)">${T('prev')} ${f.prevWeather.map((w) => wIcon(w) + esc(wName(w))).join(' / ')}</span>` : ''}</dd>
          ${f.lure ? `<dt>${T('lure')}</dt><dd class="lureline">${esc(nm(f.lure))}</dd>` : ''}
          <dt>${T('tug')}</dt><dd>${f.tugJa ?? '—'}${f.hookset ? ` ／ ${esc(nm(f.hookset))}` : ''}
            ${f.tugFromStats ? `<span style="color:var(--dim);font-size:11px">${T('fromStats')}</span>` : ''}</dd>
          ${f.snagging ? `<dt>${T('snagging')}</dt><dd>✓</dd>` : ''}
          ${f.folklore ? `<dt>${T('folklore')}</dt><dd>${esc(nm(f.folklore))}</dd>` : ''}
          ${f.fishEyes ? '<dt>フィッシュアイ</dt><dd>有効</dd>' : ''}
          ${(f.craft || f.gc || f.collectable) ? `<dt>${T('uses')}</dt><dd>${[
            f.craft ? `${T('craftUse')}（${f.craft.map((c) => esc(nm(DB.meta.craftNames[c]))).join('・')}）` : '',
            f.collectable ? T('collectUse') : '',
            f.gc ? T('gcUse') : '',
          ].filter(Boolean).join(' / ')}</dd>` : ''}
          ${f.oceanPoints != null ? `<dt>${T('points')}</dt><dd>${f.oceanPoints}${T('ptsUnit')}${
            f.oceanMulti != null ? ` / ${T('multiHook')} ×${f.oceanMulti}` : ''}</dd>` : ''}
          ${f.oceanBonus ? `<dt>${T('bonus')}</dt><dd>${f.oceanBonus.map((b) => esc(nm(b.n))).join('<br>')}</dd>` : ''}
          ${f.patch ? `<dt>${T('released')}</dt><dd>Patch ${f.patch}</dd>` : ''}
        </dl>
      </div>

      <div class="dsec">
        <span class="eyebrow">${T('bite')}${spot ? ' · ' + esc(nm(spot.n)) : ''}</span>
        ${biteSec}
      </div>

      <div class="dsec">
        <span class="eyebrow">${T('windows')}${spot ? ' · ' + esc(nm(spot.n)) : ''}</span>
        ${winHTML}
      </div>

      <div class="dsec">
        <span class="eyebrow">${T('place')} ${f.spots.length}</span>
        ${f.spots.map((id) => { const s = spotById.get(id); return s ? `
          <button class="spotchip" data-spot="${s.id}">${esc(nm(s.n))}
            <small>${esc(nm(s.area))}${s.level ? ' · Lv' + s.level : ''}</small></button>` : ''; }).join('')}
      </div>
    </div>`;
  $('#drawer').classList.add('open');
  $('#scrim').classList.add('open');
  $('#drawer .close').focus();

  const copy = $('#copykey');
  if (copy) copy.addEventListener('click', () => {
    navigator.clipboard?.writeText(snippet);
    copy.textContent = 'コピーしました';
    setTimeout(() => (copy.textContent = 'スニペットをコピー'), 1600);
  });
}

  $('#drawer').classList.remove('open');
  $('#scrim').classList.remove('open');
}

document.addEventListener('click', (e) => {

  if (areaBtn) {
    const d = areaBtn.parentElement;
    setTimeout(() => d.open ? state.openAreas.add(d.dataset.area) : state.openAreas.delete(d.dataset.area), 0);
  }
  const exBtn = e.target.closest('.exp > summary');
  if (exBtn) {
    const d = exBtn.parentElement;
    setTimeout(() => d.open ? state.openEx.add(d.dataset.ex) : state.openEx.delete(d.dataset.ex), 0);
  }
  if (e.target.closest('#home')) {
    state.view = 'welcome'; state.spotId = null; state.query = ''; $('#q').value = '';
    syncHash(); renderSide(); renderWelcome(); closeDrawer();
    $('#side').classList.remove('open');
    return;
  }
  if (e.target.closest('#nav-nushi')) {
    state.view = 'nushi'; state.query = ''; $('#q').value = '';
    syncHash(); renderSide(); render(); closeDrawer();
    $('#side').classList.remove('open');
    return;
  }
  if (e.target.closest('#nav-ocean')) {
    state.view = 'ocean'; state.query = ''; $('#q').value = '';
    syncHash(); renderSide(); render(); closeDrawer();
    $('#side').classList.remove('open'); $('#scrim').classList.remove('side');
    return;
  }
  const od = e.target.closest('[data-od]');
  if (od) { state.oceanDest = od.dataset.od; renderOcean(); return; }
  if (e.target.closest('[data-ot]')) { state.oceanTargets = !state.oceanTargets; renderOcean(); return; }
  if (e.target.closest('[data-ol]')) { state.oceanLegendOnly = !state.oceanLegendOnly; renderOcean(); return; }
  const ml = e.target.closest('[data-map]');
  if (ml) {
    e.stopPropagation();
    const sp = spotById.get(Number(ml.dataset.map));
    if (sp) openMap(sp);
    return;
  }
  if (e.target.closest('#showmap')) {
    const sp = spotById.get(state.spotId);
    if (sp) openMap(sp);
    return;
  }
  const fv = e.target.closest('[data-fav]');
  if (fv) {
    e.stopPropagation();
    const id = Number(fv.dataset.fav);
    toggleFav(id);
    // 詳細パネルを開いたまま押されたときは、そのボタンだけ描き直す
    const on = state.favs.has(id);
    document.querySelectorAll(`[data-fav="${id}"]`).forEach((el) => {
      el.setAttribute('aria-pressed', on);
      el.textContent = on ? '★' : '☆';
    });
    if ($('#drawer').classList.contains('open')) return;
    if (state.view === 'nushi') renderNushi(); else render();
    return;
  }
  const nf = e.target.closest('[data-nf]');
  if (nf) { state.favOnly = !state.favOnly; renderNushi(); return; }
  if (e.target.closest('[data-favall]')) {
    // いま画面に出ているぶんだけをまとめて★にする（絞り込みと併用できる）
    document.querySelectorAll('.nrow[data-fish]').forEach((r) => state.favs.add(Number(r.dataset.fish)));
    syncHash(); renderNushi(); return;
  }
  if (e.target.closest('[data-favclear]')) { state.favs.clear(); syncHash(); renderNushi(); return; }
  const cg = e.target.closest('[data-caught]');
  if (cg) {
    e.stopPropagation();
    const id = Number(cg.dataset.caught);
    state.caught.has(id) ? state.caught.delete(id) : state.caught.add(id);
    store.save(state.caught);
    const on = state.caught.has(id);
    document.querySelectorAll(`[data-caught="${id}"]`).forEach((el) => {
      el.setAttribute('aria-pressed', on);
      el.textContent = on ? '✔' : '□';
    });
    document.querySelector(`.fishrow[data-fish="${id}"]`)?.classList.toggle('done', on);
    document.querySelector(`.nrow[data-fish="${id}"]`)?.classList.toggle('done', on);
    return;
  }
  if (e.target.closest('[data-caughtall]')) {
    document.querySelectorAll('[data-caught]').forEach((b) => state.caught.add(Number(b.dataset.caught)));
    store.save(state.caught); renderNushi(); return;
  }
  if (e.target.closest('[data-caughtclear]')) { state.caught.clear(); store.save(state.caught); renderNushi(); return; }
  if (e.target.closest('[data-uncaught]')) { state.uncaughtOnly = !state.uncaughtOnly; renderNushi(); return; }
  if (e.target.closest('[data-lure]')) { state.lureOnly = !state.lureOnly; renderNushi(); return; }
  const cb = e.target.closest('[data-cb]');
  if (cb) { state.chartBait = Number(cb.dataset.cb); renderSpot(true); return; }
  const cc = e.target.closest('[data-cc]');
  if (cc) { state.chartChum = cc.dataset.cc === '1'; renderSpot(true); return; }
  const nk = e.target.closest('[data-nk]');
  if (nk) { state.nushiKind = nk.dataset.nk; renderNushi(); return; }
  const np = e.target.closest('[data-np]');
  if (np) { state.nushiPatch = np.dataset.np; state.nushiVer = 'all'; renderNushi(); return; }
  const nv = e.target.closest('[data-nv]');
  if (nv) { state.nushiVer = nv.dataset.nv; renderNushi(); return; }
  const ns = e.target.closest('[data-ns]');
  if (ns) { state.nushiSort = ns.dataset.ns; renderNushi(); return; }
  const spotEl = e.target.closest('[data-spot]');
  if (spotEl) { selectSpot(spotEl.dataset.spot); return; }
  const fishEl = e.target.closest('[data-fish]');
  if (fishEl) {
    const sid = fishEl.dataset.fishspot ? Number(fishEl.dataset.fishspot) : state.spotId;
    openFish(Number(fishEl.dataset.fish), sid);
    return;
  }
  if (e.target.closest('.drawer .close') || e.target.id === 'scrim') closeDrawer();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeDrawer(); }
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Enter' && e.target.classList?.contains('fishrow')) {
    openFish(Number(e.target.dataset.fish), state.spotId);
  }
});

let qt;
$('#q').addEventListener('input', (e) => {
  clearTimeout(qt);
  qt = setTimeout(() => { state.query = e.target.value; render(); }, 130);
});
$('#t-eyes').addEventListener('click', (e) => {
  state.fishEyes = !state.fishEyes;
  e.currentTarget.setAttribute('aria-pressed', state.fishEyes);
  winCache.clear();
  upCache.clear();
  render();
});
$('#t-live').addEventListener('click', (e) => {
  state.liveOnly = !state.liveOnly;
  e.currentTarget.setAttribute('aria-pressed', state.liveOnly);
  render();
});
$('#t-cond').addEventListener('click', (e) => {
  state.condOnly = !state.condOnly;
  e.currentTarget.setAttribute('aria-pressed', state.condOnly);
  render();
});
$('#lang').addEventListener('change', (e) => {
  state.lang = e.target.value;
  fmtCache.clear();
  syncHash(); renderChrome(); renderSide(); render();
});
$('#tz').addEventListener('change', (e) => {
  state.tz = e.target.value;
  fmtCache.clear();
  syncHash(); renderChrome(); render(); drawRing();
});
$('#menubtn').addEventListener('click', () => {
  const open = $('#side').classList.toggle('open');
  $('#scrim').classList.toggle('side', open);
});
$('#scrim').addEventListener('click', () => {
  $('#side').classList.remove('open');
  $('#scrim').classList.remove('side');
});

/* ══════════════════════════════════════════════════════════
   起動
   ══════════════════════════════════════════════════════════ */
(function init() {
  state.caught = store.load();
  // ハッシュ指定が無ければブラウザの言語に寄せる
  const pref = (navigator.languages ?? [navigator.language ?? 'ja']).map((x) => x.slice(0, 2));
  const hit = pref.find((x) => LANGS.some((l) => l.id === x));
  if (hit) state.lang = hit;
  readHash();
  if (location.hash.startsWith('#nushi')) state.view = 'nushi';
  if (location.hash.startsWith('#ocean')) state.view = 'ocean';
  const m = location.hash.match(/spot\/(\d+)/);
  if (m && spotById.has(Number(m[1]))) {
    state.view = 'spot';
    state.spotId = Number(m[1]);
    const sp = spotById.get(state.spotId);
    state.openAreas.add(sp.area.ja);
    state.openEx.add(String(sp.ex));
  } else {
    state.openEx.add(String(DB.areaOrder[0].ex));
  }
  // 条件未収録のヌシは、前提魚から実効条件を組み立てておく
  for (const f of Object.values(DB.fish)) f.derived = deriveCond(f);
  // ヘッダは折り返しで高さが変わるので、実測してサイドバーの起点に使う
  const syncHeaderHeight = () => {
    const h = document.querySelector('header')?.offsetHeight;
    if (h) document.documentElement.style.setProperty('--header-h', `${h}px`);
  };
  syncHeaderHeight();
  window.addEventListener('resize', syncHeaderHeight);
  if (window.ResizeObserver) new ResizeObserver(syncHeaderHeight).observe(document.querySelector('header'));

  renderChrome();
  renderSide();
  render();
  drawRing();
  setInterval(drawRing, 1000);
  // ET が1時間進むごとに表示を更新（天候・出現状況が変わるため）
  // 表示中の内容は時間で変わるので定期的に描き直す
  setInterval(() => {
    if (state.query.trim()) return;
    if (state.view === 'nushi') renderNushi();
    else if (state.view === 'ocean') renderOcean();
    else if (state.spotId) renderSpot(true);
  }, 60 * 1000);
})();
  // ヒットタイムが遅れて届いたときに差し込む
  return function applyBite(bite) {
    DB.bite = bite;
    for (const [key, rec] of Object.entries(bite)) {
      const [sp, fi, ba] = key.split(':').map(Number);
      if (!biteIndex.has(sp)) { biteIndex.set(sp, new Map()); biteBaitTotals.set(sp, new Map()); }
      const m = biteIndex.get(sp);
      if (!m.has(fi)) m.set(fi, []);
      m.get(fi).push({ baitId: ba, ...rec });
      const t = biteBaitTotals.get(sp);
      t.set(ba, (t.get(ba) ?? 0) + rec.n);
    }
    for (const m of biteIndex.values()) for (const arr of m.values()) arr.sort((a, b) => b.n - a.n);
    DB.meta.biteTimeCount = Object.keys(bite).length;
    render();
  };
}

/* ── 読み込み ─────────────────────────────────────────── */
const stage = document.getElementById('stage');
const showError = (msg) => {
  stage.innerHTML = `<div class="empty"><h2>データを読み込めませんでした</h2>
    <p>${msg}</p>
    <ul><li>ページを再読み込みしてみてください</li>
        <li>ローカルのファイルを直接開いている場合は、単体版（standalone.html）をお使いください</li></ul></div>`;
};

if (INLINE_DATA) {
  startApp(INLINE_DATA);
} else {
  stage.innerHTML = `<div class="empty"><span class="eyebrow">LOADING</span>
    <h2 style="margin-top:8px">読み込み中…</h2>
    <p>釣り場と魚のデータを取得しています。</p></div>`;
  fetch(DATA_URLS.core)
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then((core) => {
      core.bite = {};
      const applyBite = startApp(core);
      // ヒットタイムは後追い。失敗しても本体は動く。
      fetch(DATA_URLS.bite)
        .then((r) => (r.ok ? r.json() : null))
        .then((b) => b && applyBite(b))
        .catch(() => {});
    })
    .catch((e) => showError(`取得に失敗しました（${e.message}）。`));
}
</script>
