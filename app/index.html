<style>
/* ══════════════════════════════════════════════════════════
   トークン
   深い水の底から見上げた色。蓄光ルアーのグリーンだけが光る。
   ══════════════════════════════════════════════════════════ */
:root{
  /* FF14 のウィンドウを思わせる紺に、金の縁取りと水晶の青を乗せる */
  --ink:#0C1526;        /* いちばん奥 */
  --deep:#152340;       /* パネル */
  --deeper:#101C33;     /* 沈んだ面 */
  --raise:#1D2F52;      /* 浮いた面 */
  --edge:#2E4A7D;       /* 境界 */
  --edge-soft:#1E3358;
  --foam:#EFF4FD;       /* 本文 */
  --mist:#9CB2D6;       /* 補助 */
  --dim:#637BA6;        /* さらに弱い */

  --gold:#F5C563;       /* 主役。FF14 の縁取りの金 */
  --gold-dim:#8A6B2A;
  --aqua:#4FDCEC;       /* 水晶の青。！ と現在地 */
  --lime:#8FE870;       /* いま釣れる */
  --coral:#FF7E7E;      /* ！！！ */
  --violet:#BB93F5;     /* 伝承録 */
  --rose:#FF9FD0;       /* オオヌシ */

  --glow:var(--aqua);   /* 旧名の互換 */
  --amber:var(--gold);

  --night:#24365C; --dawn:#F2A96B; --day:#79DCF2; --dusk:#B583E8;

  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Roboto Mono","Noto Sans Mono CJK JP",monospace;
  --sans:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;

  --r:8px;
  --r-sm:5px;
  --pill:999px;
  --sidebar:300px;
  --header-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 620px at 12% -8%, #1B2E52 0%, transparent 62%),
    radial-gradient(900px 520px at 92% 4%, #1A2C4E 0%, transparent 58%),
    var(--ink);
  color:var(--foam);
  font-family:var(--sans); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:var(--glow)}
::selection{background:var(--gold);color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* 細いスクロールバー */
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--edge-soft);border-radius:9px}
*::-webkit-scrollbar-thumb:hover{background:var(--edge)}

/* ── 見出しの小ラベル（英字を計器のように） ───────────── */
.eyebrow{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--dim);
}

/* ══════════════════════════════════════════════════════════
   骨格
   ══════════════════════════════════════════════════════════ */
#app{display:grid;grid-template-rows:auto 1fr;height:100%}

header{
  display:flex;align-items:center;gap:18px;
  padding:0 18px;height:var(--header-h);
  background:linear-gradient(180deg,#1B2C4E,#12203A);
  border-bottom:1px solid var(--edge);
  position:relative;z-index:20;
}
header::after{ /* 金の縁取り */
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold) 18%,var(--gold) 82%,transparent);
  opacity:.55;
}
.brand{display:flex;align-items:center;gap:10px;flex:none;cursor:pointer;text-align:left}
.brand:hover .mark{transform:scale(1.06)}
.brand .mark{transition:transform .12s}
.brand .ttl{display:block}
.brand .mark{
  width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none;
  background:linear-gradient(145deg,var(--gold),#C89B3C);color:#12203A;
  box-shadow:0 2px 10px rgba(245,197,99,.28);
}
.brand b{font-size:17px;font-weight:800;letter-spacing:.03em;line-height:1.15}
.brand .sub{
  display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;
  color:var(--gold);opacity:.75;
}


/* ── ET時計：24分割のリング ─────────────────────────────── */
.clock{display:flex;align-items:center;gap:10px;flex:none}
.clock svg{display:block}
.clock-read{line-height:1.25}
.clock-read b{font-family:var(--mono);font-size:16px;letter-spacing:.04em;font-weight:700;color:var(--gold)}
.clock-read div{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim)}

/* ── 検索 ─────────────────────────────────────────────── */
.search{flex:1;max-width:460px;position:relative}
.search input{
  width:100%;background:rgba(8,16,30,.6);border:1px solid var(--edge-soft);
  border-radius:var(--pill);padding:8px 13px 8px 32px;font-size:13px;
}
.search input:focus{border-color:var(--aqua);outline:none;box-shadow:0 0 0 3px rgba(79,220,236,.14)}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--dim)}

.picks{display:flex;gap:6px;flex:none;margin-left:auto}
.picks select{
  background:rgba(8,16,30,.6);border:1px solid var(--edge-soft);border-radius:var(--pill);
  padding:6px 10px;font-size:11.5px;color:var(--mist);cursor:pointer;
}
.picks select:hover{border-color:var(--gold);color:var(--foam)}
.picks select:focus{outline:none;border-color:var(--aqua)}
.clock-read.lt b{color:var(--aqua)}
.clock-read.lt{padding-left:10px;border-left:1px solid var(--edge-soft)}
@media (max-width:1180px) and (min-width:781px){.clock-read.lt{display:none}}
@media (max-width:900px){.picks select{padding:5px 8px;font-size:11px}}
.toggles{display:flex;gap:6px;flex:none}
.tgl{
  font-size:11.5px;font-weight:600;letter-spacing:.02em;
  padding:6px 13px;border:1px solid var(--edge);border-radius:var(--pill);
  color:var(--mist);white-space:nowrap;transition:background .12s,color .12s;
}
.tgl:hover{border-color:var(--gold);color:var(--foam)}
.tgl[aria-pressed="true"]{
  background:linear-gradient(145deg,var(--gold),#DCA945);border-color:var(--gold);
  color:#12203A;font-weight:700;box-shadow:0 2px 10px rgba(245,197,99,.25);
}

main{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:0}

/* ══════════════════════════════════════════════════════════
   サイドバー：エリア → 釣り場
   ══════════════════════════════════════════════════════════ */
aside{
  border-right:1px solid var(--edge);background:rgba(16,28,51,.82);
  overflow-y:auto;min-height:0;padding-bottom:40px;
}
.nav{border-bottom:1px solid var(--edge);padding:6px 0}
.nav button{
  width:100%;display:flex;align-items:center;gap:9px;padding:8px 14px;
  font-size:12.5px;font-weight:700;color:var(--mist);text-align:left;
  border-left:2px solid transparent;
}
.nav button:hover{background:rgba(46,74,125,.35);color:var(--foam)}
.nav button[aria-current="true"]{color:var(--gold);border-left-color:var(--gold);background:rgba(245,197,99,.10)}
.nav .nv-i{
  font-size:10px;font-weight:700;width:20px;height:20px;flex:none;
  display:grid;place-items:center;border-radius:var(--r-sm);
  background:linear-gradient(145deg,var(--gold),#C89B3C);color:#12203A;
}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--dim)}

.exp{border-bottom:1px solid var(--edge)}
.exp>summary{
  display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;
  padding:10px 14px;font-size:12.5px;font-weight:800;letter-spacing:.02em;color:var(--gold);
}
.exp>summary::-webkit-details-marker{display:none}
.exp>summary:hover{background:rgba(245,197,99,.08)}
.exp>summary .caret{font-family:var(--mono);font-size:9px;color:var(--gold-dim);transition:transform .16s ease;flex:none}
.exp[open]>summary .caret{transform:rotate(90deg)}
.exp>summary .count{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--dim);font-weight:400}
.exp .area>summary{padding-left:24px;font-size:12px;font-weight:600}
.exp .spotlist button{padding-left:38px}

.area{border-bottom:1px solid var(--edge-soft)}
.area>summary{
  display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;
  padding:9px 14px;font-size:12.5px;font-weight:700;
  letter-spacing:.02em;color:var(--mist);
}
.area>summary::-webkit-details-marker{display:none}
.area>summary:hover{color:var(--foam);background:rgba(46,74,125,.3)}
.area>summary .caret{
  font-family:var(--mono);font-size:9px;color:var(--dim);
  transition:transform .16s ease;flex:none;
}
.area[open] .caret{transform:rotate(90deg)}
.area[open]>summary{color:var(--foam)}
.area .count{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.spotlist{padding:0 0 6px}
.spotlist button{
  width:100%;text-align:left;padding:5px 14px 5px 28px;font-size:12.5px;
  color:var(--mist);display:flex;align-items:center;gap:7px;
  border-left:2px solid transparent;
}
.spotlist button:hover{background:rgba(46,74,125,.3);color:var(--foam)}
.spotlist button[aria-current="true"]{
  color:var(--aqua);border-left-color:var(--aqua);background:rgba(79,220,236,.10);font-weight:600;
}
.spotlist .lv{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.spotlist .gig{color:var(--rose);font-size:10px;flex:none}

/* ══════════════════════════════════════════════════════════
   本体
   ══════════════════════════════════════════════════════════ */
section.stage{overflow-y:auto;min-height:0;padding:0 0 80px}
.wrap{max-width:1560px;margin:0 auto;padding:22px 28px}

/* ── 釣り場ヘッダ ─────────────────────────────────────── */
.spothead-row{display:flex;align-items:flex-start;gap:22px;flex-wrap:wrap}
.spothead-row>.sh-main{flex:1;min-width:min(100%,340px)}
.spot-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;margin-bottom:6px}
.spot-head h1{font-size:29px;font-weight:800;letter-spacing:.01em;line-height:1.2}
.spot-head h1.hasmap{cursor:pointer}
.spot-head h1.hasmap:hover{color:var(--gold)}
.mapicon{font-size:14px;color:var(--gold);margin-left:8px;vertical-align:middle;opacity:.8}
.mapwrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--edge)}
.mapinner{position:relative;width:100%;padding-top:100%;overflow:hidden;background:var(--deeper)}
.mapinner img{position:absolute;display:block;height:auto}
.mapfail{display:none;padding:20px;font-size:12px;color:var(--dim)}
.mapwrap.failed .mapinner{display:none}
.mapwrap.failed .mapfail{display:block}
.mapwrap.thumb .mapring{display:none}
.spotmap{
  position:relative;width:230px;border-radius:var(--r);overflow:hidden;cursor:pointer;
  margin-top:14px;
}
.spotmap:hover{box-shadow:0 0 0 1px var(--gold)}
.missions{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:10px}
.mschip{
  font-size:10.5px;padding:3px 9px;border-radius:var(--pill);white-space:nowrap;
  background:rgba(187,147,245,.13);color:var(--violet);border:1px solid rgba(187,147,245,.3);
}
.lv.ms{color:var(--violet);background:rgba(187,147,245,.16)}
.spotmap .mapzoom{
  position:absolute;right:6px;bottom:6px;z-index:2;font-size:12px;color:var(--foam);
  background:rgba(8,16,30,.8);border-radius:4px;padding:2px 6px;
}
.mapdot{
  position:absolute;width:11px;height:11px;border-radius:50%;background:var(--coral);
  border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(0,0,0,.6);
}
.mapring{
  position:absolute;width:52px;height:52px;border-radius:50%;transform:translate(-50%,-50%);
  border:2px solid var(--coral);opacity:.55;
}
.spot-head h1 .gigmark{
  font-size:11px;font-weight:700;vertical-align:middle;margin-left:9px;padding:3px 9px;
  border-radius:var(--pill);background:rgba(255,159,208,.16);color:var(--rose);
}
.spot-head .meta{font-family:var(--mono);font-size:11px;color:var(--mist);letter-spacing:.04em}
.spot-head .meta b{color:var(--foam);font-weight:600}

/* ── 天候予報の帯 ─────────────────────────────────────── */
.forecast{display:flex;gap:2px;margin:18px 0 4px;overflow-x:auto;padding-bottom:4px}
.wcell{
  flex:0 0 84px;background:var(--deep);border:1px solid var(--edge-soft);
  border-radius:var(--r);padding:8px 9px;
}
.wcell.now{border-color:var(--aqua);background:rgba(79,220,236,.10);box-shadow:0 0 0 1px rgba(79,220,236,.2)}
.wcell .t{font-family:var(--mono);font-size:9.5px;color:var(--dim);letter-spacing:.06em}
.wcell .n{font-size:11.5px;margin-top:2px;line-height:1.35}
.wcell.now .n{color:var(--aqua);font-weight:700}

/* ── ウィンドウ・ガント（署名要素） ───────────────────── */
.gantt{
  margin:22px 0 8px;background:linear-gradient(180deg,var(--deep),var(--deeper));
  border:1px solid var(--edge-soft);border-radius:var(--r);overflow:hidden;
}
.gantt summary{
  padding:11px 15px;cursor:pointer;display:flex;align-items:center;gap:10px;
  font-size:12.5px;font-weight:700;letter-spacing:.02em;list-style:none;color:var(--gold);
}
.gantt summary::-webkit-details-marker{display:none}
.gantt summary::before{content:"▸";font-family:var(--mono);font-size:9px;color:var(--dim)}
.gantt[open] summary::before{content:"▾"}
.gantt summary .eyebrow{margin-left:auto}
.gbody{padding:4px 14px 16px;overflow-x:auto}
.gaxis{position:relative;height:16px;margin-left:170px;margin-right:104px;border-bottom:1px solid var(--edge)}
.gaxis span{
  position:absolute;top:0;font-family:var(--mono);font-size:9px;color:var(--mist);
  transform:translateX(-50%);white-space:nowrap;
}
.gaxis i{position:absolute;top:16px;width:1px;height:1000px;background:var(--edge-soft);opacity:.55}
.tl .gbody{position:relative;overflow:hidden}
.tlrange{margin-left:auto;display:flex;gap:4px}
.chipbtn.sm{font-size:10px;padding:3px 8px}
.chipbtn.bait{display:inline-flex;align-items:center;gap:5px}
.baiticon{width:17px;height:17px;flex:none;border-radius:3px}
.collicon{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.shmark{width:12px;height:12px;vertical-align:-2px;margin-right:3px}
.tag.speed{color:var(--aqua);background:rgba(79,220,236,.12)}
.spmark{font-style:normal;font-family:var(--mono);letter-spacing:-2px;margin-right:4px;font-weight:800}
.spmark.s0{color:#6E86B8} .spmark.s1{color:var(--aqua)} .spmark.s2{color:var(--lime)}
.spmark.s3{color:var(--gold)} .spmark.s4{color:var(--coral)}
.uptag{
  display:inline-block;font-family:var(--mono);font-size:10px;color:var(--dim);
  white-space:nowrap;line-height:1.5;
}
.uptag.r1{color:var(--gold);background:rgba(245,197,99,.12);padding:1px 7px;border-radius:var(--pill)}
.uptag.r2{color:#FFB05C;background:rgba(255,176,92,.14);padding:1px 7px;border-radius:var(--pill);font-weight:700}
.uptag.r3{
  color:#2A1030;background:linear-gradient(145deg,var(--rose),#E574B4);
  padding:1px 8px;border-radius:var(--pill);font-weight:800;
}
.obonus{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:7px}
.oblabel{
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim);margin-right:2px;
}
.obchip{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
  padding:3px 9px;border-radius:var(--pill);white-space:nowrap;
  background:rgba(143,232,112,.14);color:var(--lime);border:1px solid rgba(143,232,112,.35);
}
.obchip.party{background:rgba(79,220,236,.14);color:var(--aqua);border-color:rgba(79,220,236,.35)}
.btitles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.btitle{
  background:rgba(21,35,64,.55);border:1px solid var(--edge-soft);border-radius:var(--r);padding:11px 12px;
}
.bt-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bt-mul{font-family:var(--mono);font-size:11px;color:var(--gold);font-weight:700}
.bt-req{font-size:11.5px;color:var(--mist);line-height:1.55}
.bt-route{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;font-size:10.5px}
.bt-links{display:flex;flex-direction:column;gap:3px;margin-top:8px;border-top:1px solid var(--edge-soft);padding-top:7px}
.glink{
  font-size:11.5px;color:var(--aqua);text-decoration:none;display:flex;align-items:baseline;gap:6px;
}
.glink:hover{color:var(--gold);text-decoration:underline}
.glink small{font-size:9.5px;color:var(--dim)}
.bt-general{margin-top:14px;display:flex;flex-direction:column;gap:3px}
.bt-general .eyebrow{margin-bottom:3px}
.obchip i{font-style:normal;font-family:var(--mono);font-size:9px;opacity:.75}
.nrow.rare{background:linear-gradient(90deg,rgba(255,159,208,.10),transparent 55%)}
.nrow.rare.open{background:linear-gradient(90deg,rgba(255,159,208,.14),rgba(143,232,112,.07) 55%)}
.rare1{color:var(--gold)} .rare2{color:#FFB05C} .rare3{color:var(--rose);font-weight:800}
.spotlink{color:inherit;cursor:pointer;border-bottom:1px dotted var(--dim)}
.spotlink:hover{color:var(--gold);border-bottom-color:var(--gold)}
.mapbtn{margin-left:5px;color:var(--gold);cursor:pointer;font-size:11px;opacity:.75}
.mapbtn:hover{opacity:1}
.gwhen{width:104px;flex:none;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--mist);padding-left:8px}
.gwhen .live{color:var(--lime)}
.gwhen>span,.gwhen>b{white-space:nowrap}
.tlcount{
  font-family:var(--mono);font-size:10px;color:var(--gold);background:rgba(245,197,99,.14);
  padding:2px 8px;border-radius:var(--pill);
}
.grow.on{background:rgba(143,232,112,.07)}
.grow:nth-child(even){background:rgba(255,255,255,.018)}
.grow:hover{background:rgba(46,74,125,.35)}
.grow{display:flex;align-items:center;height:26px;border-radius:3px}
.gname{
  width:170px;flex:none;font-size:11.5px;color:var(--mist);display:flex;align-items:center;gap:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 10px 0 6px;
}
.gname>span:last-child{overflow:hidden;text-overflow:ellipsis}
.gname:hover{color:var(--aqua);cursor:pointer}
.gtrack{position:relative;flex:1;height:13px;background:rgba(8,16,30,.6);border-radius:3px;overflow:hidden}
.gbar{position:absolute;top:0;height:13px;border-radius:2px;background:var(--gold);opacity:.85;min-width:2px}
.gbar.now{background:var(--lime);opacity:1;box-shadow:0 0 8px rgba(143,232,112,.5)}
.gbar.soon{background:var(--gold)}
.gnow{position:absolute;left:0;top:-2px;width:2px;height:17px;background:var(--coral);border-radius:2px}
.gempty{padding:14px 0;font-size:12px;color:var(--dim)}

/* ── ヒットタイム分布 ─────────────────────────────────── */
.baitbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:2px 0 14px}
.baitbar .eyebrow{margin-right:4px}
.baxis{position:relative;height:14px;margin-left:196px;margin-right:52px;border-bottom:1px solid var(--edge-soft)}
.baxis span{position:absolute;top:0;font-family:var(--mono);font-size:9px;color:var(--dim);transform:translateX(-50%)}
.brow{display:flex;align-items:center;gap:0;height:26px;cursor:pointer}
.brow:hover{background:rgba(29,47,82,.55)}
.bname{width:150px;flex:none;font-size:11.5px;color:var(--mist);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.brow:hover .bname{color:var(--aqua)}
.btug{width:46px;flex:none;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:-.5px}
.btrack{position:relative;flex:1;height:24px;border-left:1px solid var(--edge-soft)}
.btrack svg{width:100%;height:24px;display:block}
.brange{
  position:absolute;top:5px;font-family:var(--mono);font-size:9.5px;color:var(--foam);
  white-space:nowrap;margin-left:5px;text-shadow:0 0 4px var(--ink),0 0 4px var(--ink);
}
.brate{width:52px;flex:none;text-align:right;font-family:var(--mono);font-size:11px;color:var(--mist)}
.brate small{display:block;font-size:8.5px;color:var(--dim)}
.bnote{margin-top:14px;font-size:10.5px;color:var(--dim);line-height:1.7}

/* ── オーシャンフィッシング ───────────────────────────── */
.nav .nv-i.sea{background:linear-gradient(145deg,var(--aqua),#2FA6C4);color:#07222B}
.ohead,.orow{display:grid;grid-template-columns:140px 1fr 1fr;gap:16px}
.ohead{padding:0 12px 7px;border-bottom:1px solid var(--edge);position:sticky;top:0;background:var(--ink);z-index:5}
.ohead>div{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.orow{padding:11px 12px;border-bottom:1px solid var(--edge-soft);align-items:flex-start}
.orow.now{background:rgba(143,232,112,.08);box-shadow:inset 3px 0 0 var(--lime)}
.otime b{display:block;font-family:var(--mono);font-size:14px;font-weight:700}
.otime span{font-size:10.5px;color:var(--mist)}
.orow.now .otime span{color:var(--lime);font-weight:700}
.oname{font-size:13px;font-weight:700;display:flex;align-items:baseline;gap:7px}
.oname.indigo{color:#8FA9F5}
.oname.ruby{color:var(--rose)}
.oname em{font-style:normal;font-size:10px;font-weight:400;color:var(--dim)}
.opath{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-top:5px}
.ostop{
  font-size:11px;color:var(--mist);cursor:pointer;padding:2px 7px;border-radius:var(--pill);
  background:rgba(46,74,125,.4);white-space:nowrap;
}
.ostop:hover{background:rgba(245,197,99,.16);color:var(--foam)}
.ostop.plain{cursor:default}
.ostop i{font-style:normal;font-size:9px;margin-left:4px;font-weight:700}
.ostop i.td{color:var(--gold)} .ostop i.ts{color:#FFA96B} .ostop i.tn{color:#8FA9F5}
.oarrow{color:var(--dim);font-size:9px}
.otargets{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.otgt{
  font-size:10.5px;padding:3px 8px;border-radius:var(--pill);cursor:pointer;white-space:nowrap;
  background:rgba(46,74,125,.35);color:var(--mist);border:1px solid transparent;
}
.otgt:hover{border-color:var(--gold);color:var(--foam)}
.otgt.legend{background:rgba(245,197,99,.16);color:var(--gold);font-weight:700}
.otgt i{font-style:normal;font-size:9px;color:var(--dim);margin-left:5px}
.otgt.legend i{color:var(--gold-dim)}
.tag.legend{color:var(--gold);background:rgba(245,197,99,.14)}
.tag.otime{color:var(--aqua);background:rgba(79,220,236,.12)}
.tag.bonus{color:var(--lime);background:rgba(143,232,112,.12)}
.tag.trigger{color:var(--violet);background:rgba(187,147,245,.14)}
.tag.rarefish{color:var(--rose);background:rgba(255,159,208,.14)}
.rank{
  font-family:var(--mono);font-size:10px;font-weight:800;padding:2px 7px;border-radius:var(--pill);
  margin-left:6px;background:rgba(46,74,125,.5);color:var(--mist);
}
.rank.r1{background:rgba(79,220,236,.16);color:var(--aqua)}
.rank.r2{background:rgba(245,197,99,.18);color:var(--gold)}
.rank.r3{background:linear-gradient(145deg,var(--gold),#DCA945);color:#12203A}
.otgticon{width:16px;height:16px;flex:none;border-radius:3px;margin-right:4px;vertical-align:-3px}
.otgt .ot-t{font-size:9px;margin-left:5px;opacity:.8}
.nv-i svg{width:14px;height:14px}
.dcard .fav{font-size:14px}
.tag.pts{color:var(--gold);background:rgba(245,197,99,.14);font-family:var(--mono)}
.odim{color:var(--dim)}


/* ── お気に入り ───────────────────────────────────────── */
.fav{
  color:var(--dim);font-size:15px;line-height:1;flex:none;padding:2px;
  transition:color .12s,transform .12s;
}
.fav:hover{color:var(--gold);transform:scale(1.15)}
.fav[aria-pressed="true"]{color:var(--gold)}
.fav.mini{font-size:12px;margin-left:8px}
.fav.big{font-size:22px;margin-left:auto;align-self:flex-start}
.caught{
  color:var(--dim);font-size:12px;line-height:1;flex:none;font-family:var(--mono);
  width:24px;height:24px;border:1px solid var(--edge);border-radius:5px;
  display:grid;place-items:center;transition:all .12s;
}
.caught:hover{color:var(--lime);border-color:var(--lime);background:rgba(143,232,112,.12)}
.caught[aria-pressed="true"]{color:#0C1526;border-color:var(--lime);background:var(--lime);font-weight:800}
.fishrow.done .nm,.nrow.done .nm{opacity:.55;text-decoration:line-through;text-decoration-color:var(--dim)}
.chipbtn.check{border-color:rgba(143,232,112,.5);color:var(--lime)}
.chipbtn.check:hover{background:rgba(143,232,112,.14)}
.intuit{font-size:10.5px;color:var(--gold);margin-top:3px;line-height:1.4}
.ptug{
  font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:-.05em;
  padding:0 4px;border-radius:3px;margin:0 3px;
}
.ptug.t1{color:var(--aqua);background:rgba(79,220,236,.14)}
.ptug.t2{color:var(--gold);background:rgba(245,197,99,.16)}
.ptug.t3{color:var(--coral);background:rgba(255,126,126,.16)}
.pnum{font-family:var(--mono);font-size:10px;font-weight:700;margin-left:1px}
.pplus{color:var(--dim);margin:0 5px}
.idur{
  font-family:var(--mono);font-size:9px;color:var(--dim);margin-left:7px;
  padding:1px 5px;border-radius:var(--pill);background:rgba(46,74,125,.4);
}
.intuit .ilabel{
  font-size:9px;font-weight:700;padding:1px 5px;border-radius:var(--pill);
  background:rgba(245,197,99,.16);margin-right:4px;
}
.tag.use{color:var(--mist);background:rgba(46,74,125,.5)}
.tag.lure{font-weight:700}
.lureicon{width:19px;height:19px;flex:none;vertical-align:middle;border-radius:3px}
.lureicon.lg{width:26px;height:26px;margin-right:6px}
.lureicon.amb{box-shadow:0 0 0 1px rgba(255,176,92,.6)}
.lureicon.mod{box-shadow:0 0 0 1px rgba(79,220,236,.6)}
.lureline{display:flex;align-items:center}
.tag.lure.amb{color:#FFB05C;background:rgba(255,176,92,.16);border-color:rgba(255,176,92,.5)}
.tag.lure.mod{color:var(--aqua);background:rgba(79,220,236,.14);border-color:rgba(79,220,236,.5)}
.wchip.lurechip{background:rgba(255,176,92,.16);color:#FFB05C}
.lureline{color:#FFB05C;font-weight:600}
.assumed{color:var(--mist);font-size:11.5px;line-height:1.6}
.maplink{color:inherit;text-decoration:none;cursor:pointer;border-bottom:1px dotted var(--dim)}
.maplink:hover{color:var(--gold);border-bottom-color:var(--gold)}
.grow .dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--gold);margin-right:6px;vertical-align:middle;
}
.grow .dot.oo{background:var(--rose)}

/* ── ツールバー ───────────────────────────────────────── */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:24px 0 10px}
.toolbar .eyebrow{margin-right:auto}
.chipbtn{
  font-size:11px;font-weight:600;padding:5px 11px;
  border:1px solid var(--edge-soft);border-radius:var(--pill);color:var(--mist);
  background:rgba(29,47,82,.5);
}
.chipbtn:hover{border-color:var(--edge);color:var(--foam)}
.chipbtn[aria-pressed="true"]{
  border-color:var(--aqua);color:var(--ink);background:var(--aqua);font-weight:700;
}

/* ── 魚テーブル ───────────────────────────────────────── */
.thead,.fishrow{
  display:grid;
  grid-template-columns:minmax(190px,1.6fr) minmax(160px,1.5fr) minmax(120px,1fr) minmax(120px,1.1fr) 66px 100px;
  gap:14px;align-items:center;
}
.thead{
  padding:0 12px 7px;border-bottom:1px solid var(--edge);
  position:sticky;top:0;background:var(--ink);z-index:5;
}
.thead>div{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.fishrow{
  padding:9px 12px;border-bottom:1px solid var(--edge-soft);cursor:pointer;
  transition:background .1s;
}
.fishrow:hover{background:rgba(29,47,82,.55)}
.fishrow.live{background:rgba(143,232,112,.07);box-shadow:inset 3px 0 0 var(--lime)}

.fname{display:flex;align-items:center;gap:9px;min-width:0}
.ficon{
  width:26px;height:26px;flex:none;border-radius:var(--r-sm);
  background:rgba(46,74,125,.35);object-fit:contain;
}
.fname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.fname .tags{display:flex;gap:4px;flex:none}
.tag{
  font-size:9px;font-weight:700;letter-spacing:.04em;padding:1.5px 6px;
  border-radius:var(--pill);border:1px solid currentColor;line-height:1.5;
}
.tag.big{color:var(--gold);background:rgba(245,197,99,.12)}
.tag.folk{color:var(--violet);background:rgba(187,147,245,.12)}
.tag.coll{color:var(--aqua);background:rgba(79,220,236,.12)}
.tag.gig{color:var(--rose);background:rgba(255,159,208,.12)}
.stars{color:var(--gold);font-size:10px;letter-spacing:-1px;flex:none}

/* エサ経路 */
.bait{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:11.5px;color:var(--mist);min-width:0}
.bait .arrow{color:var(--dim);font-family:var(--mono);font-size:9px}
.bait .b{color:var(--foam)}
.bait .b.prey{color:var(--aqua)}
.bait .none{color:var(--dim)}
.bait .b.stat{color:var(--lime)}
.bait .b.stat.prey{color:var(--aqua)}
.brate-inline{font-family:var(--mono);font-size:10px;color:var(--dim)}
.ostopwrap{display:inline-flex;align-items:center;gap:2px}
.ospec{
  font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:var(--pill);cursor:pointer;
  background:rgba(187,147,245,.18);color:var(--violet);border:1px solid rgba(187,147,245,.4);
}
.ospec:hover{background:var(--violet);color:var(--ink)}
.gigmark.spec{background:rgba(187,147,245,.18);color:var(--violet)}

/* ET リボン：昼夜のグラデーションの上に有効帯を抜く */
.ribbon{position:relative;height:17px;border-radius:var(--pill);overflow:hidden;background:var(--deeper)}
.ribbon .sky{
  position:absolute;inset:0;
  background:linear-gradient(90deg,
    var(--night) 0%, var(--night) 16%, var(--dawn) 27%,
    var(--day) 38%, var(--day) 62%, var(--dusk) 75%,
    var(--night) 87%, var(--night) 100%);
  opacity:.30;
}
.ribbon .on{position:absolute;top:0;bottom:0;background:var(--lime);opacity:.55}
.ribbon .now{position:absolute;top:0;bottom:0;width:1px;background:var(--coral)}
.ribbon .lbl{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--foam);
  text-shadow:0 0 4px var(--ink),0 0 4px var(--ink);
}

/* 天候 */
.weather{display:flex;flex-wrap:wrap;gap:3px;font-size:10.5px}
.wchip{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 7px;border-radius:var(--pill);background:rgba(46,74,125,.55);color:var(--mist);
  white-space:nowrap;
}
.wicon{width:15px;height:15px;flex:none;vertical-align:middle}
.wicon.lg{width:20px;height:20px;margin-right:4px}
.wcell .n{display:flex;align-items:center}
.wchip.prev{background:transparent;border:1px dashed var(--dim);color:var(--dim)}
.wchip.hit{background:var(--aqua);color:var(--ink);font-weight:700}
.wchip.bite{background:rgba(79,220,236,.12);border:1px solid rgba(79,220,236,.5);color:var(--aqua);font-family:var(--mono);font-size:9.5px;font-weight:700}
.weather .any{color:var(--dim);font-size:11px}

/* 引き */
.tug{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:-.5px}
.tug.t1{color:var(--aqua)} .tug.t2{color:var(--gold)} .tug.t3{color:var(--coral)}
.tug small{display:block;font-size:8.5px;letter-spacing:.06em;font-weight:400;color:var(--dim)}

/* ヒットタイム */
.bite{font-family:var(--mono);font-size:12px;text-align:right}
.bite b{font-weight:600}
.bite .unit{font-size:9px;color:var(--dim)}
.bite .na{color:var(--dim);font-size:10px;letter-spacing:.06em}

/* ── 一覧の操作バーと絞り込み ─────────────────────────── */
.ctlbar{
  display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:22px 0 8px;
  padding:9px 12px;background:rgba(21,35,64,.6);border:1px solid var(--edge-soft);border-radius:var(--r);
}
.sel{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mist)}
.sel select{
  background:rgba(8,16,30,.6);border:1px solid var(--edge-soft);border-radius:var(--pill);
  padding:6px 11px;font-size:12px;color:var(--foam);cursor:pointer;
}
.sel select:hover{border-color:var(--gold)}
.ctlbtn{
  display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:6px 13px;border:1px solid var(--edge);border-radius:var(--pill);color:var(--mist);
}
.ctlbtn:hover{border-color:var(--gold);color:var(--foam)}
.ctlbtn.on{border-color:var(--gold);color:var(--gold);background:rgba(245,197,99,.10)}
.ctlbtn b{font-family:var(--mono);font-size:10px;background:var(--gold);color:#12203A;border-radius:var(--pill);padding:0 5px}
.ctlbtn i{font-style:normal;font-size:8px;opacity:.7}
.ctlcount{font-family:var(--mono);font-size:11px;color:var(--dim)}
.ctlcount .live{color:var(--lime)}
.ctlacts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

.activef{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.fchip{
  font-size:10.5px;padding:4px 10px;border-radius:var(--pill);
  background:rgba(245,197,99,.14);color:var(--gold);border:1px solid rgba(245,197,99,.35);
}
.fchip:hover{background:var(--gold);color:var(--ink)}

.fpanel{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px 18px;
  padding:14px;margin-bottom:10px;
  background:rgba(16,28,51,.7);border:1px solid var(--edge-soft);border-radius:var(--r);
}
.fgrp{display:flex;flex-direction:column;gap:5px}
.flabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.fopts{display:flex;flex-wrap:wrap;gap:4px}
.fgrp.fend{justify-content:flex-end;align-items:flex-start}
@media (max-width:780px){
  .ctlbar{gap:8px;padding:8px 10px}
  .ctlacts{margin-left:0;width:100%}
  .fpanel{grid-template-columns:1fr 1fr;gap:10px}
}

/* ── ヌシ一覧 ─────────────────────────────────────────── */
.nhead,.nrow{
  display:grid;
  grid-template-columns:96px minmax(150px,1.1fr) minmax(180px,1.1fr) minmax(120px,.9fr) minmax(140px,1fr) minmax(160px,1.25fr);
  gap:12px;align-items:start;
}
.nhead{padding:0 12px 7px;border-bottom:1px solid var(--edge);position:sticky;top:0;background:var(--ink);z-index:5}
.nhead>div{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.nrow{padding:11px 12px;border-bottom:1px solid var(--edge-soft);cursor:pointer}
.nkind{display:flex;align-items:center;gap:5px}
.nspot small{display:block;font-size:10px;color:var(--dim);margin-top:1px}
.nbait{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.nnext .rel.dim{color:var(--dim)}
.patch{
  font-family:var(--mono);font-size:9px;color:var(--dim);background:rgba(46,74,125,.45);
  padding:1px 5px;border-radius:var(--pill);flex:none;
}
.chipbtn.star{border-color:rgba(245,197,99,.5);color:var(--gold)}
.chipbtn.star:hover{background:rgba(245,197,99,.14)}
.wchip.guess{background:rgba(255,126,126,.14);color:var(--coral);border:1px solid rgba(255,126,126,.4)}
.nrow:hover{background:rgba(29,47,82,.55)}
.nrow.open{background:rgba(143,232,112,.07);box-shadow:inset 3px 0 0 var(--lime)}
.kind{
  font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:var(--pill);
  background:rgba(245,197,99,.14);color:var(--gold);white-space:nowrap;
}
.kind.oo{background:linear-gradient(145deg,var(--rose),#E574B4);color:#2A1030}
.nname{font-size:13.5px;display:flex;align-items:center;gap:7px;min-width:0;padding-top:1px}
.nname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nspot{font-size:11.5px;color:var(--mist);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncond{display:flex;flex-wrap:wrap;gap:3px;font-size:10.5px}
.nnext{font-family:var(--mono);font-size:12px;line-height:1.4}
.nnext .abs{color:var(--foam)}
.nnext .rel{font-size:10.5px;color:var(--mist)}
.nnext .live{color:var(--lime);font-weight:700}
.nnext .never{color:var(--dim);font-size:10.5px;letter-spacing:.06em}
.nnext .anytime{color:var(--mist);font-size:11px}
.nrow.always{box-shadow:inset 2px 0 0 var(--edge)}
.ndur{font-family:var(--mono);font-size:11px;color:var(--mist);text-align:right}

/* ── 検索結果 ─────────────────────────────────────────── */
.result{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-bottom:1px solid var(--edge-soft);cursor:pointer;
}
.result:hover{background:rgba(29,47,82,.55)}
.ficon.sm{width:22px;height:22px}
.ficon.lg{width:44px;height:44px;border-radius:var(--r)}
.dhead{display:flex;align-items:center;gap:12px;padding-right:26px}
.ddesc{
  margin-top:12px;font-size:12px;line-height:1.75;color:var(--mist);
  border-left:2px solid var(--gold);padding-left:11px;
}
.result .kind{
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);
  width:56px;flex:none;
}
.result .sub{margin-left:auto;font-size:11.5px;color:var(--mist)}

/* ── 詳細ドロワー ─────────────────────────────────────── */
.scrim{
  position:fixed;inset:0;background:rgba(3,12,17,.68);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);z-index:50;
  background:linear-gradient(180deg,#1B2C4E,var(--deep));border-left:1px solid var(--gold);
  transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.3,1);
  display:flex;flex-direction:column;
}
.drawer.open{transform:none}
.drawer header{
  background:none;border-bottom:1px solid var(--edge);height:auto;
  padding:16px 20px;display:block;
}
.drawer header::after{display:none}

}

.steps{list-style:none;counter-reset:s;padding:0}
.steps>li{

}
.steps>li::before{
  content:counter(s);position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;

}
.stp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:11.5px}
.stp .sn{color:var(--foam);cursor:pointer}
.stp .sn:hover{color:var(--gold)}
.stp .sx{font-family:var(--mono);color:var(--gold)}
.stp .sb{color:var(--mist);font-size:11px}

.spotchip{
  display:block;width:100%;text-align:left;padding:6px 9px;font-size:12.5px;
  border:1px solid var(--edge-soft);border-radius:var(--r);margin-bottom:5px;color:var(--mist);
}
.spotchip:hover{border-color:var(--gold);color:var(--foam);background:rgba(245,197,99,.08)}
.spotchip small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--dim)}

.btab{width:100%;border-collapse:collapse;font-size:11.5px}
.btab th{
  font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);text-align:left;padding:0 6px 5px;font-weight:400;border-bottom:1px solid var(--edge-soft);
}
.btab td{padding:6px;border-bottom:1px solid var(--edge-soft);vertical-align:middle}
.btab td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.btab td.dim{color:var(--dim)}
.btab .unit{font-size:9px;color:var(--dim)}
.btab .spark{display:block;width:100%;height:14px;color:var(--aqua);margin-top:2px}
.btab th:first-child,.btab td:first-child{text-align:left;max-width:120px;overflow:hidden;text-overflow:ellipsis}

.report{
  background:var(--deeper);border:1px solid var(--edge-soft);border-radius:var(--r);padding:12px;
}
.report p{font-size:12px;color:var(--mist);margin-bottom:9px}
.report code{
  display:block;font-family:var(--mono);font-size:10.5px;background:rgba(8,16,30,.7);
  padding:10px;border-radius:var(--r-sm);color:var(--aqua);overflow-x:auto;white-space:pre;
  border:1px solid var(--edge-soft);
}
.report button{
  margin-top:9px;font-size:11px;font-weight:600;
  border:1px solid var(--gold);color:var(--gold);padding:6px 13px;border-radius:var(--pill);
}
.report button:hover{background:var(--gold);color:var(--ink)}

/* ── ダッシュボード ───────────────────────────────────── */
.dash{max-width:1560px}
.dashhead{margin-bottom:6px}
.dashhead h1{font-size:27px;font-weight:800;letter-spacing:.01em}
.dashhead .meta{font-family:var(--mono);font-size:11px;color:var(--mist);margin-top:3px}
.dsec{margin-top:26px}
.dsec h2{
  font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.03em;
  display:flex;align-items:center;gap:9px;margin-bottom:10px;
}
.dsec h2 .cnt{font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:400}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.dcard{
  display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;
  background:rgba(21,35,64,.6);border:1px solid var(--edge-soft);border-radius:var(--r);
}
.dcard:hover{border-color:var(--gold)}
.dcard.live{background:rgba(143,232,112,.09);box-shadow:inset 3px 0 0 var(--lime)}
.dc-main{min-width:0;flex:1}
.dc-name{font-size:13.5px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dc-sub{font-size:11px;color:var(--mist);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-time{font-family:var(--mono);font-size:11.5px;text-align:right;flex:none;line-height:1.45}
.dc-time .live{color:var(--lime)}
.dc-time .rel{font-size:10px;color:var(--mist)}
.dvoy{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px}
.dv{background:rgba(21,35,64,.6);border:1px solid var(--edge-soft);border-radius:var(--r);padding:11px 12px}
.dv-t{font-family:var(--mono);font-size:14px;margin-bottom:7px}
.dv-t .rel{font-size:10.5px;color:var(--mist);margin-left:6px}
.dv-r{margin-top:10px;padding-top:10px;border-top:1px solid var(--edge-soft)}
.dv-r:first-of-type{border-top:none;padding-top:0}
.dv-r .oname{display:inline-flex;align-items:baseline;gap:6px}
.dprog{display:grid;gap:6px;max-width:620px}
.pbar{display:flex;align-items:center;gap:10px;font-size:11.5px}
.pbar .pl{width:150px;flex:none;color:var(--mist)}
.pbar .pt{flex:1;height:7px;background:var(--deeper);border-radius:7px;overflow:hidden}
.pbar .pt i{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--aqua))}
.pbar .pn{font-family:var(--mono);font-size:10.5px;color:var(--dim);width:56px;text-align:right}
@media (max-width:780px){
  .dashhead h1{font-size:21px}

  .pbar .pl{width:96px;font-size:10.5px}
}

/* ── 空状態・フッタ ───────────────────────────────────── */
.empty{padding:70px 26px;max-width:640px}
.empty h2{font-size:25px;font-weight:800;margin-bottom:12px;line-height:1.35}
.empty p{color:var(--mist);font-size:13px;margin-bottom:16px}
.empty ul{color:var(--mist);font-size:12.5px;padding-left:18px}
.empty li{margin-bottom:5px}
.credit{
  padding:26px;border-top:1px solid var(--edge-soft);margin-top:40px;
  font-size:11px;color:var(--dim);line-height:1.8;
}
.credit a{color:var(--mist)}
.credit .sqex{color:var(--mist);white-space:nowrap}

/* ══════════════════════════════════════════════════════════
   レスポンシブ
   1080px 以下で列を詰め、780px 以下では表をやめてカードに切り替える。
   スマホでは横スクロールを一切出さないことを優先した。
   ══════════════════════════════════════════════════════════ */
@media (max-width:1240px){

}
@media (min-width:1500px){
  .dgrid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
}
@media (max-width:1080px){
  .thead,.fishrow{grid-template-columns:minmax(150px,1.4fr) minmax(120px,1.2fr) 104px 92px 50px 78px}
  .nhead,.nrow{grid-template-columns:84px minmax(110px,1fr) 156px minmax(100px,1fr)}
  .nhead>div:nth-child(5),.nhead>div:nth-child(6){display:none}

}

/* ── タブレット以下：サイドバーを引き出しに ─────────────── */
@media (max-width:900px){

    transform:translateX(-100%);transition:transform .2s;box-shadow:14px 0 40px rgba(0,0,0,.45);
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  aside.open{transform:none}
  .menubtn{display:block;color:var(--mist);font-size:19px;padding:4px 2px}
  .scrim.side{opacity:1;pointer-events:auto;z-index:25}
}

/* ── スマホ：表をカードに ────────────────────────────── */
@media (max-width:780px){

  }
  .brand .ttl b{font-size:15px}
  .brand .sub{display:none}
  .clock{order:3;gap:8px}
  .clock svg{width:26px;height:26px}

  .wrap{padding:14px 12px 60px}
  .spotmap{width:100%;max-width:280px}
  .spot-head h1{font-size:22px}
  .spot-head{gap:8px}
  .eyebrow{font-size:9px}

  /* 釣り場の魚：カード */
  .thead{display:none}
  .fishrow{
    grid-template-columns:1fr auto;gap:7px 10px;padding:13px 12px;
    border-radius:var(--r);margin-bottom:7px;border:1px solid var(--edge-soft);
    background:rgba(21,35,64,.5);
  }
  .fishrow.live{background:rgba(143,232,112,.09)}
  .fishrow>.fname{grid-column:1;align-self:center}
  .fishrow>.bite{grid-column:2;align-self:center;font-size:14px}
  .fishrow>.bait{grid-column:1/-1}
  .fishrow>.ribbon{grid-column:1/-1}
  .fishrow>.weather{grid-column:1}
  .fishrow>.tug{grid-column:2;text-align:right}
  .fname .nm{font-size:14.5px}

  /* ヌシ一覧：カード */
  .nhead{display:none}
  .nrow{
    grid-template-columns:auto 1fr;gap:6px 9px;padding:13px 12px;
    border-radius:var(--r);margin-bottom:7px;border:1px solid var(--edge-soft);
    background:rgba(21,35,64,.5);
  }
  .nrow.open{background:rgba(143,232,112,.09)}
  .nrow>.nkind{grid-column:1;align-self:center}
  .nrow>.nname{grid-column:2;align-self:center}
  .nrow>.nnext,.nrow>.nspot,.nrow>.ncond,.nrow>.nbait{grid-column:1/-1}
  .nnext{font-size:12.5px}
  .nspot{white-space:normal}

  /* 運行表 */
  .ohead{display:none}
  .orow{
    grid-template-columns:1fr;gap:9px;padding:13px 12px;
    border-radius:var(--r);margin-bottom:7px;border:1px solid var(--edge-soft);
    background:rgba(21,35,64,.5);
  }
  .otime{display:flex;align-items:baseline;gap:9px}

  /* 検索結果 */
  .result{flex-wrap:wrap;gap:6px}

  .result .sub{margin-left:0;flex:1 1 100%;font-size:11px}

  /* ガント・分布 */
  .gbody{padding:4px 10px 14px}

  .gname{width:92px;font-size:10.5px}
  .baxis{margin-left:92px;margin-right:40px}

  .brange{font-size:8.5px}

}

const fmtCache = new Map();
/** loc を指定しなければ表示言語の書式。時刻だけは常に24時間表記に揃える */
function fmt(opts, loc) {

  if (!fmtCache.has(key)) {
    fmtCache.set(key, new Intl.DateTimeFormat(l, { timeZone: zoneOf(), ...opts }));
  }

/* ══════════════════════════════════════════════════════════
   エオルゼア時間と天候
   1エオルゼア日 = 4200 実秒。天候は 8 ET時間（1400 実秒）ごとに切り替わる。
   ══════════════════════════════════════════════════════════ */
const ET_RATIO = 86400 / 4200;          // 実秒 → ET秒
const ET_HOUR  = 175;                   // 1 ET時間 = 175 実秒
const W_PERIOD = ET_HOUR * 8;           // 天候1枠 = 1400 実秒
const W_MS     = W_PERIOD * 1000;

function etParts(ms = Date.now()) {
  const es = Math.floor((ms / 1000) * ET_RATIO);
  return { h: Math.floor(es / 3600) % 24, m: Math.floor(es / 60) % 60 };
}
/** 天候抽選値（0-99）。Square Enix のアルゴリズムをそのまま再現 */
function forecastTarget(ms) {
  const unix = Math.floor(ms / 1000);
  const bell = unix / 175;
  const inc = (bell + 8 - (bell % 8)) % 24;
  const days = Math.floor(unix / 4200) >>> 0;
  const base = (days * 100 + inc) >>> 0;
  const s1 = ((base << 11) ^ base) >>> 0;
  const s2 = ((s1 >>> 8) ^ s1) >>> 0;
  return s2 % 100;
}
/** 天候枠の開始時刻（実ミリ秒）に丸める */
const periodStart = (ms) => Math.floor(ms / 1000 / W_PERIOD) * W_PERIOD * 1000;

function weatherAt(territoryId, ms) {
  const wr = DB.weatherRates[territoryId];
  if (!wr) return null;
  const t = forecastTarget(ms);
  for (const [id, cum] of wr.rates) if (t < cum) return id;
  return wr.rates[wr.rates.length - 1][0];
}
const wName = (id) => nm(DB.weatherTypes[id]?.n) || `#${id}`;
/** 天候アイコン。読めなければ静かに消える */
function wIcon(id, cls = 'wicon') {
  const w = DB.weatherTypes[id];
  if (!DB.meta.icons || !w?.icon) return '';
  const alt = iconV1(w.icon);
  return `<img class="${cls}" src="${esc(DB.meta.iconBase + w.icon)}" alt="" loading="lazy"
    onerror="if(this.dataset.f){this.style.display='none'}else{this.dataset.f=1;this.src='${alt}'}">`;
}

/* ══════════════════════════════════════════════════════════
   出現判定
   ══════════════════════════════════════════════════════════ */
function inHourRange(h, start, end) {
  if (start === end) return true;
  return start < end ? h >= start && h < end : h >= start || h < end;
}
/** ET時刻は 17.5（=17:30）のような端数を取りうる */
const etLabel = (h) => `${pad(Math.floor(h) % 24)}:${pad(Math.round((h % 1) * 60))}`;
const etShort = (h) => (h % 1 === 0 ? pad(h % 24) : etLabel(h));
/** その魚が有効なET時間帯を [開始, 終了) の配列で返す（0〜24の範囲に正規化） */
function hourRanges(f) {
  if (f.startHour === f.endHour) return [[0, 24]];
  if (f.startHour < f.endHour) return [[f.startHour, f.endHour]];
  return [[f.startHour, 24], [0, f.endHour]];
}
/** 指定時刻に、その釣り場でその魚の条件が揃っているか */
function isUp(f0, territoryId, ms) {
  const fish = condOf(f0);
  if (!fish.hasConditions) return false;
  const { h } = etParts(ms);
  const timeFree = state.fishEyes && fish.fishEyes;
  if (!timeFree && !inHourRange(h, fish.startHour, fish.endHour)) return false;
  if (fish.weather.length || fish.prevWeather.length) {
    if (territoryId == null) return false;
    if (fish.weather.length) {
      const w = weatherAt(territoryId, ms);
      if (!fish.weather.includes(w)) return false;
    }
    if (fish.prevWeather.length) {
      const pw = weatherAt(territoryId, periodStart(ms) - W_PERIOD * 1000);
      if (!fish.prevWeather.includes(pw)) return false;
    }
  }
  return true;
}
/**
 * 出現ウィンドウの列挙。
 * 天候は8ET時間（1400実秒）単位でしか変わらないので、天候枠を跨いで走査し、
 * 枠内でET時間の条件と突き合わせる。ヌシのように何日も空く相手でも実用速度で出る。
 */
function findWindows(f0, territoryId, opts = {}) {
  const f = condOf(f0);
  const { days = 3, limit = 8, fishEyes = false, from = Date.now() } = opts;
  if (!f.hasConditions) return [];
  const end = from + days * 86400000;
  const timeFree = (f.startHour === 0 && f.endHour === 24) || (fishEyes && f.fishEyes);
  const wFree = !f.weather.length && !f.prevWeather.length;
  if (timeFree && wFree) return 'always';
  if (!wFree && territoryId == null) return [];

  if (wFree) {
    // 天候を問わない魚は、毎エオルゼア日おなじ時間帯に出る。走査せず直接組み立てる。
    const DAY = 4200 * 1000;
    const segs = [];
    for (let d = Math.floor(from / DAY) * DAY; d < end && segs.length < limit; d += DAY) {
      const a = d + f.startHour * ET_HOUR * 1000;
      const b = d + (f.endHour <= f.startHour ? f.endHour + 24 : f.endHour) * ET_HOUR * 1000;
      if (b <= from) continue;
      segs.push([Math.max(a, from), b]);
    }
    return segs;
  }

  const segs = [];
  for (let p = periodStart(from); p < end; p += W_MS) {
    if (segs.length > limit) break;
    if (!wFree) {
      if (f.weather.length && !f.weather.includes(weatherAt(territoryId, p))) continue;
      if (f.prevWeather.length && !f.prevWeather.includes(weatherAt(territoryId, p - W_MS))) continue;
    }
    // 天候枠は必ず ET 0時 / 8時 / 16時 に始まり、8時間続く。
    // その [ph, ph+8) と魚の有効時間帯を、端数込みで正確に交差させる。
    const ph = Math.floor(etParts(p).h / 8) * 8;
    for (const [rs, re] of timeFree ? [[0, 24]] : hourRanges(f)) {
      const o0 = Math.max(rs, ph), o1 = Math.min(re, ph + 8);
      if (o1 <= o0) continue;
      const a = p + (o0 - ph) * ET_HOUR * 1000;
      const b = p + (o1 - ph) * ET_HOUR * 1000;
      if (b <= from) continue;
      const last = segs[segs.length - 1];
      if (last && last[1] >= a - 1) last[1] = Math.max(last[1], b);
      else segs.push([Math.max(a, from), b]);
    }
  }
  return segs.slice(0, limit);
}

/**
 * ヌシ用。まず60日先まで探し、それでも見つからない極端に稀な相手だけ
 * 400日先まで追いかける（「紅龍」「リッチパース」のように数ヶ月空くものがいる）。
 */
const winCache = new Map();
function nushiWindows(f, territoryId) {
  const key = `${f.id}:${state.fishEyes ? 1 : 0}`;
  const hit = winCache.get(key);
  if (hit && hit.at > Date.now() - 60000) return hit.v;
  const opts = { limit: 6, fishEyes: state.fishEyes };
  let v = findWindows(f, territoryId, { ...opts, days: 60 });
  if (v !== 'always' && !v.length && (f.weather.length || f.prevWeather.length)) {
    v = findWindows(f, territoryId, { ...opts, days: 400, limit: 3 });
  }
  winCache.set(key, { at: Date.now(), v });
  return v;
}
/**
 * 出現率のバッジ。低いほど目立たせる。
 * 数字と「レア」の別表示だと2行になったり詰まったりするので、ひとつにまとめた。
 */
function uptimeTag(up) {
  const lv = up < 0.5 ? 3 : up < 2 ? 2 : up < 6 ? 1 : 0;
  const txt = `${up < 1 ? up.toFixed(1) : Math.round(up)}%`;
  if (!lv) return `<span class="uptag">${T('uptime')} ${txt}</span>`;
  return `<span class="uptag r${lv}" title="${T('uptime')} ${txt}">${'★'.repeat(lv)} ${T('rare')} ${txt}</span>`;
}

/** 30日ぶんを走査して出現率を出す。ヌシの「どれくらい待つか」の目安になる */
const upCache = new Map();
function uptime(f, territoryId) {
  const key = `${f.id}:${state.fishEyes ? 1 : 0}`;
  if (upCache.has(key)) return upCache.get(key);
  const days = 30, from = Date.now();
  const ws = findWindows(f, territoryId, { days, limit: 1e9, fishEyes: state.fishEyes, from });
  let v = null;
  if (ws === 'always') v = 100;
  else if (ws.length) v = (ws.reduce((a, [x, y]) => a + (y - x), 0) / (days * 86400000)) * 100;
  upCache.set(key, v);
  return v;
}

/** 直近（またはいま開いている）ウィンドウ。'always' はそのまま返す */
function nextWindow(list) {
  if (list === 'always') return 'always';
  const now = Date.now();
  return list.find(([, b]) => b > now) ?? null;
}

/**
 * 条件が未収録のヌシでも、直感の前提魚が縛られていれば、そこから窓は導ける。
 * 前提魚を釣らないと本命は釣れないので、前提魚の条件がそのまま実効的な条件になる。
 * いちばん狭い前提魚を採用する。
 */
function deriveCond(f) {
  if (!(f.unknownTime || f.unknownWeather) || !f.predators.length) return null;
  const cands = f.predators
    .map(([id]) => DB.fish[id])
    .filter((p) => p && p.hasConditions &&
      (p.weather.length || p.prevWeather.length || p.startHour !== 0 || p.endHour !== 24));
  if (!cands.length) return null;
  const span = (p) => {
    const h = p.startHour < p.endHour ? p.endHour - p.startHour : 24 - p.startHour + p.endHour;
    return h * (p.weather.length ? p.weather.length / 20 : 1);
  };
  const p = cands.sort((a, b) => span(a) - span(b))[0];
  return {
    startHour: p.startHour, endHour: p.endHour,
    weather: p.weather, prevWeather: p.prevWeather,
    fishEyes: false, hasConditions: true,
    fromPredator: p.id,
  };
}
/** 判定・窓の計算に使う実効条件 */
const condOf = (f) => f.derived ?? f;

const isConditional = (f0) => { const f = condOf(f0);
  return f.weather.length || f.prevWeather.length ||
         f.startHour !== 0 || f.endHour !== 24 || f0.predators.length; };

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
/* 実時間の整形はすべて選択中のタイムゾーンを通す */
const hhmm = (ms) => fmt({ hour: '2-digit', minute: '2-digit', hour12: false }, 'en-GB').format(ms);
const ymd = (ms) => fmt({ year: 'numeric', month: '2-digit', day: '2-digit' }, 'en-CA').format(ms);
const md = (ms) => fmt({ month: 'numeric', day: 'numeric' }).format(ms);
const dayLabel = (ms) => (ymd(ms) === ymd(Date.now()) ? '' : `${md(ms)} `);
const mins = (a, b) => Math.round((b - a) / 60000);

const spotById = new Map(DB.spots.map((s) => [s.id, s]));
for (const f of Object.values(DB.fish)) f.derived = null;   // deriveCond のあとで埋める

/**
 * アイテムアイコン。XIVAPI v2 のアセット配信を使う。
 * v2 が落ちていたら旧 CDN に切り替え、それも駄目なら黙って消す。
 */
function iconV1(path) {
  const m = /ui\/icon\/(\d+)\/(\d+)/.exec(path || '');
  return m ? `https://xivapi.com/i/${m[1]}/${m[2]}.png` : '';
}
function iconImg(f, cls = 'ficon') {

  const alt = iconV1(f.icon);
  return `<img class="${cls}" src="${esc(DB.meta.iconBase + f.icon)}" alt="" loading="lazy" decoding="async"
    onerror="if(this.dataset.f){this.style.visibility='hidden'}else{this.dataset.f=1;this.src='${alt}'}">`;
}

/* ── ヒットタイム ─────────────────────────────────────────
   キーは "釣り場ID:魚ID:エサID"。釣り場→魚→エサ の順に引ける索引を作る。 */
const biteIndex = new Map();      // spotId -> Map(fishId -> [{baitId, rec}])
const biteBaitTotals = new Map(); // spotId -> Map(baitId -> サンプル合計)
for (const [key, rec] of Object.entries(DB.bite ?? {})) {
  const [sp, fi, ba] = key.split(':').map(Number);
  if (!biteIndex.has(sp)) { biteIndex.set(sp, new Map()); biteBaitTotals.set(sp, new Map()); }
  const m = biteIndex.get(sp);
  if (!m.has(fi)) m.set(fi, []);
  m.get(fi).push({ baitId: ba, ...rec });
  const t = biteBaitTotals.get(sp);
  t.set(ba, (t.get(ba) ?? 0) + rec.n);
}
for (const m of biteIndex.values()) for (const arr of m.values()) arr.sort((a, b) => b.n - a.n);

/**
 * 実測の釣果率は「そのエサで1回投げたとき、その魚がかかる確率」。
 * 競合する魚が多いエサほど自然に下がるので、率そのものが「抽選の当たりやすさ」になっている。
 *
 * ただし観測回数が少ないと率が当てにならない（10回で3匹釣れて30%、など）。
 * そこで Wilson の下側信頼限界を採り、少ないサンプルの率を割り引いて比べる。
 */
function wilsonLower(rate, catches, misses) {
  if (!rate || rate <= 0) return 0;
  const succ = catches + (misses ?? 0);
  const total = Math.round(succ / (rate / 100));
  if (!total || succ > total) return 0;
  const z = 1.96, p = succ / total, n = total;
  return Math.max(0, (p + (z * z) / (2 * n) - z * Math.sqrt((p * (1 - p)) / n + (z * z) / (4 * n * n))) / (1 + (z * z) / n));
}

/** その釣り場でそのエサに反応する魚の種類数（率1%未満は数えない） */
const baitCompetition = new Map();          // `${spotId}:${baitId}` -> 種類数
function competitionOf(spotId, baitId) {
  const key = `${spotId}:${baitId}`;
  if (baitCompetition.has(key)) return baitCompetition.get(key);
  let n = 0;
  for (const arr of biteIndex.get(spotId)?.values() ?? []) {
    if (arr.some((r) => r.baitId === baitId && (r.rate ?? 0) >= 1)) n++;
  }
  baitCompetition.set(key, n);
  return n;
}

/**
 * その釣り場・その魚でいちばん釣りやすいエサ。
 * 信頼限界がほぼ並んだときは、抽選の選択肢が少ない（競合の魚が少ない）ほうを選ぶ。
 */
function bestBaitByRate(fishId, spotId) {
  const arr = biteIndex.get(spotId)?.get(fishId);
  if (!arr?.length) return null;
  const scored = arr.filter((r) => r.rate != null && r.rate > 0).map((r) => ({
    ...r,
    lower: wilsonLower(r.rate, r.n, r.miss),
    rivals: competitionOf(spotId, r.baitId),
  }));
  if (!scored.length) return null;
  scored.sort((a, b) => {
    if (Math.abs(a.lower - b.lower) > 0.02) return b.lower - a.lower;   // 2ポイント以上の差は率で決める
    if (a.rivals !== b.rivals) return a.rivals - b.rivals;              // 僅差なら競合が少ないほう
    return b.n - a.n;                                                   // それも同じなら実測が多いほう
  });
  return scored[0];
}
/** エサのアイコン。魚（泳がせ）なら魚のアイコンを使う */

const SPEED_ORDER = ['超低速', '極低速', '低速', 'やや低速', '普通', 'やや高速', '高速', '極高速', '超高速', '最高速', '爆速'];
function SPEED_MARK(sp) {
  const i = SPEED_ORDER.indexOf(sp.ja);
  const lv = i < 0 ? 2 : i <= 1 ? 0 : i <= 3 ? 1 : i <= 4 ? 2 : i <= 6 ? 3 : 4;
  return `<i class="spmark s${lv}">${'›'.repeat(lv + 1)}</i>`;
}

/** 収集品の印 */
const COLLECT_SVG = `<svg class="collicon" viewBox="0 0 16 16" aria-hidden="true">
  <path d="M8 1.6 9.9 5.6l4.4.6-3.2 3.1.8 4.4L8 11.6l-3.9 2.1.8-4.4L1.7 6.2l4.4-.6z"

/** 竿に付けられるエサか（魚なら泳がせ、つまり竿には付けられない） */
const isRealBait = (id) => !DB.fish[id];

/**
 * エサの並び順。釣り場ごとに順序が変わらないよう、内容だけで決める。
 * 竿に付けるエサを左、泳がせ（魚）を右。同じ組の中はアイテムID順。
 * IDはおおむね実装順＝必要レベル順に並んでいるので、
 * オーシャンフィッシングも イワイソメ → クリル → ファットワーム → 万能ルアー になる。
 */
// オーシャンフィッシング専用のエサ。この4つは常に先頭に、この順で置く。
const VERSATILE_LURE = 29717;                  // 万能ルアー。どの釣り場でも先頭に置く
const OCEAN_BAITS = [29714, 29715, 29716];     // イワイソメ / クリル / ファットワーム
function baitRank(id, ocean) {
  if (!isRealBait(id)) return 3;                    // 泳がせ（魚）は右端
  if (id === VERSATILE_LURE) return 0;              // 万能ルアーは常に先頭
  if (ocean && OCEAN_BAITS.includes(id)) return 1;  // オーシャン専用エサ
  return 2;                                         // その他のエサ
}
/** 釣り場によって順が変わらないよう、内容だけで決める比較関数を作る */
function baitOrderFor(ocean) {
  return (a, b) => {
    const ra = baitRank(a, ocean), rb = baitRank(b, ocean);
    if (ra !== rb) return ra - rb;
    if (ra === 1) return OCEAN_BAITS.indexOf(a) - OCEAN_BAITS.indexOf(b);
    return a - b;   // アイテムIDはおおむね実装順＝必要レベル順
  };
}

/**
 * 実測から組み立てるエサの道筋。
 * 一番強いのが泳がせ（＝魚）なら、その魚を釣るためのエサまで遡って「A ▸ B」の形にする。
 * 泳がせでしか釣れない魚は、遡れないのでその魚の名前だけを出す。
 */
function baitPathByRate(fishId, spotId) {
  const top = bestBaitByRate(fishId, spotId);
  if (!top) return null;
  if (isRealBait(top.baitId)) return { path: [top.baitId], rate: top.rate };
  // 泳がせ。エサになる魚を釣るためのエサを探す
  const prey = bestBaitByRate(top.baitId, spotId);
  if (prey && isRealBait(prey.baitId)) {
    return { path: [prey.baitId, top.baitId], rate: top.rate, preyRate: prey.rate };
  }
  return { path: [top.baitId], rate: top.rate, swimOnly: true };
}

/** その釣り場・その魚で、いちばん頼れる1件。使うエサが分かっていればそれを優先 */
function bestBite(fishId, spotId, preferBait) {
  const arr = biteIndex.get(spotId)?.get(fishId);
  if (!arr?.length) return null;
  return (preferBait != null && arr.find((r) => r.baitId === preferBait)) || arr[0];
}

const B36 = '0123456789abcdefghijklmnopqrstuvwxyz';
const HIST_BIN = 0.5;                     // ヒストグラム1本 = 0.5 秒
function unpackHist(str) {
  if (!str) return null;
  const i = str.indexOf(':');
  const start = Number(str.slice(0, i));
  return { start, v: [...str.slice(i + 1)].map((c) => B36.indexOf(c)) };
}
/** 分布を面グラフのSVGパスにする。maxSec で横軸の縮尺を決める */
function histPath(h, maxSec, w = 350, ht = 24) {
  const pts = [];
  const x = (bin) => ((bin * HIST_BIN) / maxSec) * w;
  pts.push(`M${x(h.start).toFixed(1)},${ht}`);
  h.v.forEach((v, i) => pts.push(`L${x(h.start + i).toFixed(1)},${(ht - (v / 35) * ht).toFixed(1)}`));
  pts.push(`L${x(h.start + h.v.length - 1).toFixed(1)},${ht}Z`);
  return pts.join('');
}
/** エサ名。ff14fish は「どちらでも可」の候補を配列で持つので、その場合は並べる */
const baitName = (id) => {
  if (Array.isArray(id)) return id.map(baitName).join(' / ');
  return nm(DB.baits[id]?.n) || nm(DB.fish[id]?.n) || `#${id}`;
};
/** 実測を引くときの代表エサ。候補が複数なら先頭を使う */
const baitKey = (id) => (Array.isArray(id) ? id[0] : id);

  $('#etring').innerHTML = `

    <circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="var(--glow)" stroke-width="2.5"
