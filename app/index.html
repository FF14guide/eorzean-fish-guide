function ribbonHTML(f) {
  const { h, m } = etParts();
  if (!f.hasConditions) {
    return `<div class="ribbon" title="出現条件のデータがありません">
      <div class="sky" style="opacity:.10"></div>
      <div class="lbl" style="color:var(--dim)">${T('unknown')}</div></div>`;
  }
  const nowPct = ((h + m / 60) / 24) * 100;
  let bars = '';
  if (f.startHour === 0 && f.endHour === 24) {
    bars = `<div class="on" style="left:0;right:0;opacity:.30"></div>`;
  } else if (f.startHour < f.endHour) {
    bars = `<div class="on" style="left:${f.startHour / 24 * 100}%;width:${(f.endHour - f.startHour) / 24 * 100}%"></div>`;
  } else {
    bars = `<div class="on" style="left:${f.startHour / 24 * 100}%;right:0"></div>
            <div class="on" style="left:0;width:${f.endHour / 24 * 100}%"></div>`;
  }
  const label = f.startHour === 0 && f.endHour === 24
    ? T('allDay')
    : `${etShort(f.startHour)}–${etShort(f.endHour)}`;
  return `<div class="ribbon" title="ET ${label}">
    <div class="sky"></div>${bars}
    <div class="now" style="left:${nowPct}%"></div>
    <div class="lbl">${label}</div></div>`;
}

function weatherHTML(f, territoryId) {
  if (!f.hasConditions) return `<div class="weather"><span class="any">${T('unknown')}</span></div>`;
  if (!f.weather.length && !f.prevWeather.length) {
    return `<div class="weather"><span class="any"${f.condAssumed
      ? ` title="${T('assumedFree')}${f.catches ? ` (${f.catches})` : ''}"` : ''}>${T('anyWeather')}</span></div>`;
  }
  const nowW = territoryId != null ? weatherAt(territoryId, Date.now()) : null;
  const prevW = territoryId != null ? weatherAt(territoryId, periodStart(Date.now()) - W_PERIOD * 1000) : null;
  const prev = f.prevWeather.map((w) =>
    `<span class="wchip prev${w === prevW ? ' hit' : ''}">${T('prev')}${wIcon(w)}${esc(wName(w))}</span>`).join('');
  const cur = f.weather.map((w) =>
    `<span class="wchip${w === nowW ? ' hit' : ''}">${wIcon(w)}${esc(wName(w))}</span>`).join('');
  return `<div class="weather">${prev}${cur}</div>`;
}

/** 前提魚。引きの強さを添えて、どのフッキングを使うかその場で分かるようにする */
function predatorHTML(f) {
  if (!f.predators.length) return '';
  const p = f.predators.map(([id, n]) => {
    const pf = DB.fish[id];
    const tug = pf?.tugJa ? `<b class="ptug t${pf.tugRank}">${pf.tugJa}</b>` : '';
    return `${esc(nm(pf?.n) || baitName(id))}${tug}<span class="pnum">×${n}</span>`;
  }).join('<span class="pplus">+</span>');
  return `<div class="intuit"><span class="ilabel">${T('intuition')}</span> ${p}${
    f.intuition ? `<span class="idur">${f.intuition}${T('secU')}</span>` : ''}</div>`;
}

function baitHTML(f, spotId) {
  if (!f.baitPath.length) {
    // 上流にエサが無くても、実測の釣果率から推せる（主にオーシャンフィッシング）
    const b = spotId != null ? baitPathByRate(f.id, spotId) : null;
    if (b) {
      const parts = b.path.map((id, i) =>
        `${i ? '<span class="arrow">▸</span>' : ''}<span class="b stat${i ? ' prey' : ''}">${esc(baitName(id))}</span>`);
      return `<div class="bait" title="${T('byRate')}${b.swimOnly ? ` / ${T('swimOnly')}` : ''}${
        b.rivals ? ` / ${T('rivals')} ${b.rivals}` : ''}">
        ${parts.join('')}<span class="brate-inline">${b.rate}%</span></div>`;
    }
    if (f.predators.length) return `<div class="bait">${predatorHTML(f)}</div>`;
    return `<div class="bait"><span class="none">—</span></div>`;
  }
  const parts = f.baitPath.map((id, i) =>
    `${i ? '<span class="arrow">▸</span>' : ''}<span class="b${i ? ' prey' : ''}">${esc(baitName(id))}</span>`);
  // エサと直感の両方が要る魚は、直感が埋もれないよう下に添える
  return `<div class="bait">${parts.join('')}${predatorHTML(f)}</div>`;
}

function biteHTML(f, spotId) {
  const b = bestBite(f.id, spotId, baitKey(f.baitPath[f.baitPath.length - 1]));
  if (!b || b.lo == null) return `<div class="bite"><span class="na">${T('notMeasured')}</span></div>`;
  return `<div class="bite" title="${esc(baitName(b.baitId))}で ${b.n} 件の実測${b.rate != null ? ` / 釣果率 ${b.rate}%` : ''}">
    <b>${b.lo}–${b.hi}</b><span class="unit">s</span></div>`;
}

/**
 * モデストルアー／アンビシャスルアー。
 * アタリが来てから使う「引きを変える」アクションなので、エサとは別に印を出す。
 */
function lureTag(f, big = false) {
  if (!f.lure) return '';
  const amb = /Ambitious/i.test(f.lure.en);
  const url = DB.meta.lureIcons?.[amb ? 'Ambitious' : 'Modest'];
  if (DB.meta.icons && url) {
    return `<img class="lureicon${big ? ' lg' : ''} ${amb ? 'amb' : 'mod'}" src="${esc(DB.meta.iconBase + url)}"
      alt="${esc(nm(f.lure))}" title="${esc(nm(f.lure))}" loading="lazy"
      onerror="if(this.dataset.f){this.replaceWith(Object.assign(document.createElement('span'),{className:'tag lure ${amb ? 'amb' : 'mod'}',textContent:'${T(amb ? 'lureAmb' : 'lureMod')}'}))}else{this.dataset.f=1;this.src='${iconV1(url)}'}">`;
  }
  return `<span class="tag lure ${amb ? 'amb' : 'mod'}" title="${esc(nm(f.lure))}">${
    T(amb ? 'lureAmb' : 'lureMod')}</span>`;
}

function fishRow(f, spot) {
  const live = isUp(f, spot.territoryId, Date.now());
  const tags = [
    f.bigFish ? `<span class="tag big">${T('bigFish')}</span>` : '',
    f.folklore ? `<span class="tag folk">${T('folklore')}</span>` : '',
    f.collectable ? `<span class="tag coll">${COLLECT_SVG}${T('collectUse')}</span>` : '',
    f.gig ? `<span class="tag gig" title="${T('shadow')}: ${T('shadow' + f.gig)}">${
      SHADOW_MARK[f.gig] ?? ''}${T('shadow' + f.gig)}</span>` : '',
    f.gigSpeed ? `<span class="tag speed" title="${T('gigSpeed')}: ${esc(nm(f.gigSpeed))}">${
      SPEED_MARK(f.gigSpeed)}${esc(nm(f.gigSpeed))}</span>` : '',
    lureTag(f),
    f.oceanLegend ? `<span class="tag legend">${T('legendFish')}</span>` : '',
    f.oceanRare ? `<span class="tag rarefish">${T('rareFish')}</span>` : '',
    f.spectralTrigger ? `<span class="tag trigger">${T('trigger')}</span>` : '',
    f.oceanTimes ? `<span class="tag otime">${f.oceanTimes.map(timeLabel).join('/')}${T('onlySuffix')}</span>` : '',
    f.oceanPoints != null ? `<span class="tag pts">${f.oceanPoints}${T('ptsUnit')}</span>` : '',
    f.oceanMulti != null ? `<span class="tag pts">×${f.oceanMulti}</span>` : '',
    ...(f.oceanBonus ?? []).map((b) => `<span class="tag bonus">${esc(nm(b.n))}</span>`),
    f.craft ? `<span class="tag use" title="${f.craft.map((c) => nm(DB.meta.craftNames[c])).join(' / ')}">${T('craftUse')}</span>` : '',
    f.gc ? `<span class="tag use">${T('gcUse')}</span>` : '',
  ].join('');
  const stars = f.stars ? `<span class="stars">${'★'.repeat(f.stars)}</span>` : '';
  const tugCls = f.tugRank ? `t${f.tugRank}` : '';
  return `<div class="fishrow${live ? ' live' : ''}${state.caught.has(f.id) ? ' done' : ''}" data-fish="${f.id}" tabindex="0" role="button">
    <div class="fname">${caughtBtn(f.id)}${iconImg(f)}<span class="nm">${esc(nm(f.n))}</span>${stars}<span class="tags">${tags}</span></div>
    ${baitHTML(f, spot.id)}
    ${ribbonHTML(f)}
    ${weatherHTML(f, spot.territoryId)}
    <div class="tug ${tugCls}">${f.tugJa ?? '<span style="color:var(--dim)">—</span>'}
      ${f.hookset ? `<small title="${esc(nm(f.hookset))}">${esc(nm(f.hookset).replace(/フッキング|Hookset|Anhieb|Ferrage /g, '').trim())}</small>` : ''}</div>
    ${biteHTML(f, spot.id)}
  </div>`;
}

/* ══════════════════════════════════════════════════════════
   ウィンドウ・ガント（署名要素）
   ══════════════════════════════════════════════════════════ */
function ganttHTML(fishes, spot, hours = 12) {
  const conditional = fishes.filter((f) => isConditional(f) && f.hasConditions);
  if (!conditional.length) {
    return `<details class="gantt"><summary>${T('windowTitle')}<span class="eyebrow">NEXT ${hours}H</span></summary>
      <div class="gbody"><div class="gempty">${T('noCond')}</div></div></details>`;
  }
  const t0 = Date.now(), span = hours * 3600 * 1000;
  const axis = [];
  for (let i = 0; i <= hours; i += 3) {
    const t = t0 + i * 3600 * 1000;
    axis.push(`<span style="left:${(i / hours) * 100}%">${hhmm(t)}</span>`);
  }
  const rows = conditional.slice(0, 40).map((f) => {
    const wsR = findWindows(f, spot.territoryId, { days: hours / 24, limit: 40, fishEyes: state.fishEyes });
    const ws = wsR === 'always' ? [[t0, t0 + span]] : wsR;
    const bars = ws.map(([a, b]) => {
      const l = Math.max(0, (a - t0) / span) * 100;
      const w = Math.max(0.5, ((b - a) / span) * 100);
      const soon = a > t0;
      return `<div class="gbar${soon ? ' soon' : ''}" style="left:${l}%;width:${Math.min(w, 100 - l)}%"
              title="${dayLabel(a)}${hhmm(a)}–${hhmm(b)} (${fmtMin(mins(a, b))})"></div>`;
    }).join('');
    return `<div class="grow">
      <div class="gname" data-fish="${f.id}" title="${esc(nm(f.n))}">${esc(nm(f.n))}</div>
      <div class="gtrack">${bars}<div class="gnow" style="left:0"></div></div></div>`;
  }).join('');
  return `<details class="gantt" open><summary>${T('windowTitle')}<span class="eyebrow">NEXT ${hours}H · LT</span></summary>
    <div class="gbody"><div class="gaxis">${axis.join('')}</div>${rows}</div></details>`;
}


/* ══════════════════════════════════════════════════════════
   ヒットタイム分布
   同じ軸の上に釣り場の魚を並べると、「6秒台で!!ならこれ」が一目で分かる。
   ══════════════════════════════════════════════════════════ */
function biteChartHTML(spot) {
  const m = biteIndex.get(spot.id);
  const wrap = (body, note = '') => `<details class="gantt" open>
    <summary>${T('biteTitle')}<span class="eyebrow">${note}</span></summary>
    <div class="gbody">${body}</div></details>`;

  if (!m) return wrap(`<div class="gempty">${T('noBite')}</div>`, T('noData'));

  const entries = [...biteBaitTotals.get(spot.id).entries()];
  // 表示は決まった順。ただし最初に選ばれるのは実測が一番多いエサ
  const cmp = baitOrderFor(!!spot.ocean);
  const totals = entries.slice().sort((a, b) => cmp(a[0], b[0]));
  // 既定はいちばん左のエサ。釣り場ごとに選択が変わって見えるのを避ける
  const baitId = totals.some(([b]) => b === state.chartBait) ? state.chartBait : totals[0][0];
  const chum = state.chartChum;

  // エサと撒き餌の切り替えは、中身が空でも必ず出す
  const bar = `<div class="baitbar">
    <span class="eyebrow">${T('bait')}</span>
    ${totals.slice(0, 10).map(([b, n]) => `<button class="chipbtn bait" data-cb="${b}"
        aria-pressed="${b === baitId}" title="${n}">${baitIcon(b)}${esc(baitName(b))}</button>`).join('')}
    <span style="width:10px"></span>
    <button class="chipbtn" data-cc="0" aria-pressed="${!chum}">${T('chumOff')}</button>
    <button class="chipbtn" data-cc="1" aria-pressed="${chum}">${T('chumOn')}</button>
  </div>`;

  const rows = [];
  for (const [fishId, arr] of m) {
    const r = arr.find((x) => x.baitId === baitId);
    if (!r) continue;
    const h = unpackHist(chum ? r.ch : r.h);
    const lo = chum ? r.clo : r.lo, hi = chum ? r.chi : r.hi;
    if (lo == null && !h) continue;
    rows.push({ f: DB.fish[fishId], r, h, lo, hi });
  }
  if (!rows.length) {
    return wrap(bar + `<div class="gempty">${chum ? T('noChum') : T('noBite')}</div>`, T('noData'));
  }
  rows.sort((a, b) => (a.f?.tugRank ?? 9) - (b.f?.tugRank ?? 9) || (a.lo ?? 99) - (b.lo ?? 99));

  // 横軸はこの釣り場に合わせて伸縮させる（5秒刻みで切り上げ、最低20秒）
  const need = Math.max(20, ...rows.map((r) => r.hi ?? 0),
    ...rows.map((r) => (r.h ? (r.h.start + r.h.v.length) * HIST_BIN : 0)));
  const maxSec = Math.ceil(need / 5) * 5;
  const step = maxSec > 40 ? 10 : 5;
  const axis = [];
  for (let sec = 0; sec <= maxSec; sec += step) {
    axis.push(`<span style="left:${(sec / maxSec) * 100}%">${sec}${sec === maxSec ? 's' : ''}</span>`);
  }
  const TUGC = { 1: 'var(--aqua)', 2: 'var(--gold)', 3: 'var(--coral)' };

  const body = bar + `<div class="baxis">${axis.join('')}</div>` +
    rows.map(({ f, r, h, lo, hi }) => {
      const col = TUGC[f?.tugRank] ?? 'var(--mist)';
      return `<div class="brow" data-fish="${f?.id ?? ''}">
        <div class="bname" title="${esc(nm(f?.n))}">${esc(nm(f?.n)) || '?'}</div>
        <div class="btug" style="color:${col}">${f?.tugJa ?? ''}</div>
        <div class="btrack">
          <svg viewBox="0 0 350 24" preserveAspectRatio="none" aria-hidden="true">
            ${lo != null ? `<rect x="${((lo / maxSec) * 350).toFixed(1)}" y="0" width="${(((hi - lo) / maxSec) * 350).toFixed(1)}" height="24" fill="${col}" opacity=".12"/>` : ''}
            ${h ? `<path d="${histPath(h, maxSec)}" fill="${col}" opacity=".75"/>` : ''}
          </svg>
          ${lo != null ? `<span class="brange" style="left:${Math.min((hi / maxSec) * 100, 82)}%">${lo}–${hi}s</span>` : ''}
        </div>
        <div class="brate">${r.rate != null ? r.rate + '%' : '—'}<small>${r.n}</small></div>
      </div>`;
    }).join('') +
    `<div class="bnote">${T('biteSource')}</div>`;
  return wrap(body, `${rows.length} · ${T('samples')}`);
}

/* ══════════════════════════════════════════════════════════
   釣り場ビュー
   ══════════════════════════════════════════════════════════ */
function renderSpot(keepScroll = false) {
  const spot = spotById.get(state.spotId);
  if (!spot) return renderWelcome();
  const scrollY = keepScroll ? $('#stage').scrollTop : 0;

  let fishes = spot.fishes.map((id) => DB.fish[id]).filter(Boolean);
  if (state.condOnly) fishes = fishes.filter((f) => isConditional(f) && f.hasConditions);
  if (state.liveOnly) fishes = fishes.filter((f) => isUp(f, spot.territoryId, Date.now()));
  // 並べ替えない。ゲーム内の釣り手帳と同じ順（釣り場データの並び）で出す。

  // 天候予報 8 枠
  let fc = '';
  if (spot.territoryId != null && DB.weatherRates[spot.territoryId]) {
    const p0 = periodStart(Date.now());
    fc = '<div class="forecast">' + Array.from({ length: 8 }, (_, i) => {
      const t = p0 + i * W_PERIOD * 1000;
      const w = weatherAt(spot.territoryId, t);
      return `<div class="wcell${i === 0 ? ' now' : ''}">
        <div class="t">${i === 0 ? 'NOW' : dayLabel(t) + hhmm(t)}</div>
        <div class="n">${wIcon(w, 'wicon lg')}${esc(wName(w))}</div></div>`;
    }).join('') + '</div>';
  }

  const all = spot.fishes.map((id) => DB.fish[id]).filter(Boolean);
  const liveCount = all.filter((f) => isUp(f, spot.territoryId, Date.now())).length;
  const unknownCount = all.filter((f) => !f.hasConditions).length;
  const caughtHere = all.filter((f) => state.caught.has(f.id)).length;

  $('#stage').innerHTML = `<div class="wrap">
    <div class="spothead-row"><div class="sh-main">
    <div class="spot-head">
      <h1${spot.mapId != null && !spot.noMap ? ' class="hasmap" id="showmap" title="' + T('showMap') + '"' : ''}>${
        esc(nm(spot.n)).replace(/：幻海流|Spectral Current/i, '')}${
        spot.mapId != null ? '<span class="mapicon">◎</span>' : ''}${
        spot.spear ? `<span class="gigmark">${T('spearMark')}</span>` : ''}${
        spot.spectral ? `<span class="gigmark spec">${T('spectral')}</span>` : ''}</h1>
      <div class="meta">
        ${esc(nm(spot.area))}${spot.region ? ' · ' + esc(nm(spot.region)) : ''}
        ${spot.level ? ' · <b>Lv' + spot.level + '</b>' : ''}
        ${spot.x != null ? ` · X:<b>${spot.x.toFixed(1)}</b> Y:<b>${spot.y.toFixed(1)}</b>` : ''}
        ${spot.spear ? ' · <b>銛</b>' : ''}
      </div>
    </div>
    <div class="eyebrow">${esc(spot.n.en)}</div>
    ${spot.missions ? `<div class="missions">
      <span class="eyebrow">${T('missions')} ${spot.missions.length}</span>
      ${spot.missions.map((m) => `<span class="mschip">${esc(nm(m))}</span>`).join('')}
    </div>` : ''}
    ${fc}
    </div>
    ${spot.mapId != null && DB.maps?.[spot.mapId] && !spot.noMap ? `<div class="spotmap" id="spotmap" title="${T('showMap')}">
      ${mapHTML(spot, true)}<span class="mapzoom">⤢</span>
    </div>` : ''}
    </div>
    ${ganttHTML(spot.fishes.map((id) => DB.fish[id]).filter(Boolean), spot)}
    ${biteChartHTML(spot)}
    <div class="toolbar">
      <button class="chipbtn check" data-caughtall="1">✔ ${T('caughtAll')}</button>
      ${caughtHere ? `<button class="chipbtn" data-spotuncaught="1">${T('clearHere')} (${caughtHere})</button>` : ''}
      <span class="eyebrow">${T('progress')} ${caughtHere}/${all.length} · ${
        fishes.length} ${T('showing')} · ${T('live')} ${liveCount}${
        unknownCount ? ` · ${T('condMissing')} ${unknownCount}` : ''}</span>
    </div>
    <div class="thead">
      <div>${T('fish')}</div><div>${T('bait')}</div><div>${T('hours')} (ET)</div><div>${T('weather')}</div><div>${T('tug')}</div><div style="text-align:right">${T('bite')}</div>
    </div>
    <div id="rows">${fishes.map((f) => fishRow(f, spot)).join('') ||
      `<div class="gempty" style="padding:26px 12px">${state.lang === 'ja' ? '条件に合う魚がいません。フィルタを外してみてください。' : 'Nothing matches. Try clearing the filters.'}</div>`}</div>
    ${creditHTML()}
  </div>`;
  $('#stage').scrollTop = scrollY;
}

/* ══════════════════════════════════════════════════════════
   地図
   釣り場の座標をマップ画像の上に重ねる。
   ゲーム内の座標系（1〜42）から画像上の位置への変換は縮尺（size_factor）で決まる。
   ══════════════════════════════════════════════════════════ */
function mapPct(coord, sizeFactor) {
  const c = (sizeFactor ?? 100) / 100;
  return (((coord - 1) * c) / 41) * 100;
}
/**
 * 地図の画像とマーカー。
 * thumb=true は釣り場ページに埋め込む縮小版で、マーカーの周りを拡大して切り出す。
 */
function mapHTML(spot, thumb = false) {
  const m = DB.maps?.[spot.mapId];
  if (!m) return '';
  // 座標が分からない釣り場（銛や合成釣り場）はマーカーを出さず地図だけ見せる
  const hasPos = spot.x != null && spot.y != null;
  const x = hasPos ? mapPct(spot.x, m.sizeFactor) : 50;
  const y = hasPos ? mapPct(spot.y, m.sizeFactor) : 50;
  // 縮小版も全体を出す。位置関係が分かるほうが役に立つ
  const imgStyle = 'width:100%;left:0;top:0';
  const px = x, py = y;
  return `<div class="mapwrap${thumb ? ' thumb' : ''}">
    <div class="mapinner">
      <img src="${esc(m.image)}" alt="" loading="lazy" style="${imgStyle}"
        onerror="this.closest('.mapwrap').classList.add('failed')">
      ${hasPos ? `<span class="mapdot" style="left:${px}%;top:${py}%"></span>
      <span class="mapring" style="left:${px}%;top:${py}%"></span>` : ''}
    </div>
    <span class="mapfail">${T('mapFailed')}</span>
  </div>`;
}

function openMap(spot) {
  const m = DB.maps?.[spot.mapId];
  if (!m) return;
  const x = mapPct(spot.x, m.sizeFactor), y = mapPct(spot.y, m.sizeFactor);
  $('#drawer').innerHTML = `
    <header>
      <button class="close" aria-label="close">×</button>
      <div class="dhead"><div style="min-width:0">
        <h2>${esc(nm(spot.n))}</h2>
        <div class="eyebrow" style="margin-top:3px">${esc(nm(spot.area))}${
          spot.x != null ? ` · X:${spot.x.toFixed(1)} Y:${spot.y.toFixed(1)}` : ''}</div>
      </div></div>
    </header>
    <div class="dbody">
      ${mapHTML(spot)}
      <p class="bnote">${T('mapNote')}</p>
    </div>`;
  $('#drawer').classList.add('open');
  $('#scrim').classList.add('open');
}

/* ══════════════════════════════════════════════════════════
   検索ビュー
   ══════════════════════════════════════════════════════════ */
function renderSearch() {
  const q = state.query.toLowerCase();
  // どの言語で打っても引けるように、全言語を対象に探す
  const hitSpots = DB.spots.filter((s) =>
    nmAll(s.n).includes(q) || nmAll(s.area).includes(q)).slice(0, 12);
  const hitFish = Object.values(DB.fish).filter((f) => nmAll(f.n).includes(q)).slice(0, 40);
  const hitBaits = Object.values(DB.baits).filter((b) => nmAll(b.n).includes(q)).slice(0, 8);

  const baitFish = hitBaits.length
    ? Object.values(DB.fish).filter((f) => f.baitPath.some((id) => hitBaits.some((b) => b.id === id))).slice(0, 40)
    : [];

  const sec = (title, body) => body ? `<div class="dsec"><span class="eyebrow">${title}</span>${body}</div>` : '';

  $('#stage').innerHTML = `<div class="wrap">
    <div class="spot-head"><h1>「${esc(state.query)}」</h1></div>
    ${sec(T('spot'), hitSpots.map((s) => `<div class="result" data-spot="${s.id}">
        <span class="kind">SPOT</span><span>${esc(nm(s.n))}</span>
        <span class="sub">${esc(nm(s.area))}${s.level ? ' · Lv' + s.level : ''}</span></div>`).join(''))}
    ${sec(T('fish'), hitFish.map((f) => `<div class="result" data-fish="${f.id}">
        ${iconImg(f, 'ficon sm')}<span>${esc(nm(f.n))}</span>
        <span class="sub">${f.spots.map((id) => nm(spotById.get(id)?.n)).filter(Boolean).slice(0, 3).join(' / ')}</span></div>`).join(''))}
    ${sec(state.lang === 'ja' ? 'このエサで釣れる魚' : 'Fish caught with this bait', baitFish.map((f) => `<div class="result" data-fish="${f.id}">
        ${iconImg(f, 'ficon sm')}<span>${esc(nm(f.n))}</span>
        <span class="sub">${f.baitPath.map(baitName).join(' ▸ ')}</span></div>`).join(''))}
    ${!hitSpots.length && !hitFish.length && !baitFish.length
      ? `<p style="color:var(--mist)">${state.lang === 'ja' ? '該当なし。ひらがな・カタカナ・英名のいずれかで試してみてください。' : 'No matches. Try another spelling, or another language.'}</p>` : ''}
    ${creditHTML()}
  </div>`;
  $('#stage').scrollTop = 0;
}


/* ══════════════════════════════════════════════════════════
   お気に入り
   URL のハッシュに持たせるので、ブックマークすれば次も同じ顔ぶれが出るし、
   そのまま人に渡せる。
   ══════════════════════════════════════════════════════════ */
const favBtn = (id) => `<button class="fav" data-fav="${id}" aria-pressed="${state.favs.has(id)}"
  title="★" aria-label="favourite">${state.favs.has(id) ? '★' : '☆'}</button>`;
const caughtBtn = (id) => `<button class="caught" data-caught="${id}" aria-pressed="${state.caught.has(id)}"
  title="${T('caughtTip')}" aria-label="caught">${state.caught.has(id) ? '✔' : '□'}</button>`;

/**
 * 釣った／釣っていないの記録。
 * ★と違って数が増えるので URL には載せず、ブラウザに保存する。
 * 保存できない環境（ファイルを直接開いた場合など）ではその場かぎりになる。
 */
const store = {
  key: 'efg.caught',
  nfKey: 'efg.filter',
  loadFilter() {
    try {
      const o = JSON.parse(localStorage.getItem(this.nfKey) ?? 'null');
      if (!o) return null;
      o.status = new Set(o.status ?? []);
      o.tug = new Set(o.tug ?? []);
      return o;
    } catch { return null; }
  },
  saveFilter(nf) {
    try {
      localStorage.setItem(this.nfKey, JSON.stringify({ ...nf, status: [...nf.status], tug: [...nf.tug] }));
    } catch { /* 保存できなくても動く */ }
  },
  load() {
    try { return new Set(JSON.parse(localStorage.getItem(this.key) ?? '[]')); }
    catch { return new Set(); }
  },
  save(set) {
    try { localStorage.setItem(this.key, JSON.stringify([...set])); } catch { /* 保存できなくても動く */ }
  },
};

/**
 * URL の同期。
 * 画面を移ったときは履歴に積み（戻るで戻れる）、
 * 言語やお気に入りのような設定変更は積まずに書き換えるだけにする。
 */
function syncHash(push = false) {
  const base = state.view === 'nushi' ? 'nushi'
    : state.view === 'ocean' ? 'ocean'
    : state.spotId ? `spot/${state.spotId}` : '';
  const f = state.favs.size ? `|f=${[...state.favs].join('.')}` : '';
  const fi = state.openFish ? `&fish=${state.openFish}` : '';
  const l = state.lang !== 'ja' ? `|l=${state.lang}` : '';
  const z = state.tz !== 'auto' ? `|z=${state.tz}` : '';
  const url = `#${base}${fi}${f}${l}${z}`;
  if (url === location.hash) return;
  if (push) history.pushState(null, '', url);
  else history.replaceState(null, '', url);
}
function readHash() {
  const m = location.hash.match(/[&|]f=([\d.]+)/);
  if (m) state.favs = new Set(m[1].split('.').map(Number).filter(Boolean));
  const l = location.hash.match(/[&|]l=(\w+)/);
  if (l && LANGS.some((x) => x.id === l[1])) state.lang = l[1];
  const z = location.hash.match(/[&|]z=([\w-]+)/);
  if (z && ZONES.some((x) => x.id === z[1])) state.tz = z[1];
  const fi = location.hash.match(/[&|]fish=(\d+)/);
  if (fi && DB.fish[fi[1]]) state.pendingFish = Number(fi[1]);
}
function toggleFav(id) {
  state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
  syncHash();
}

/* ══════════════════════════════════════════════════════════
   通知
   ★を付けた魚の窓が開いたら知らせる。数時間〜数日待つ相手がいるので、
   画面を見張らなくても済むようにする。
   ══════════════════════════════════════════════════════════ */
const notify = {
  on: false,
  opened: new Set(),      // 通知済み（同じ窓で二度鳴らさない）
  async enable() {
    if (!('Notification' in window)) return false;
    if (Notification.permission === 'granted') return true;
    if (Notification.permission === 'denied') return false;
    return (await Notification.requestPermission()) === 'granted';
  },
  beep() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const g = ac.createGain(); g.connect(ac.destination); g.gain.value = 0.05;
      [880, 1320].forEach((f, i) => {
        const o = ac.createOscillator();
        o.type = 'sine'; o.frequency.value = f; o.connect(g);
        o.start(ac.currentTime + i * 0.14);
        o.stop(ac.currentTime + i * 0.14 + 0.12);
      });
      setTimeout(() => ac.close(), 800);
    } catch { /* 音が出せなくても通知は出す */ }
  },
  fire(f, spot, until) {
    this.beep();
    try {
      new Notification(nm(f.n), {
        body: `${nm(spot?.n) ?? ''} · ${T('nowBiting')} (${remainText(mins(Date.now(), until))})`,
        tag: `fish-${f.id}`,
      });
    } catch { /* 通知が塞がれていても音は鳴る */ }
  },
  /** ★の魚を見て、いま開いたものがあれば知らせる */
  check() {
    const now = Date.now();
    for (const id of state.favs) {
      const f = DB.fish[id];
      if (!f) continue;
      const spot = spotById.get(f.nushiSpot ?? f.spots[0]);
      const ws = nushiWindows(f, spot?.territoryId ?? null);
      if (ws === 'always') continue;
      const w = nextWindow(ws);
      if (!w) continue;
      const key = `${id}:${w[0]}`;
      if (w[0] <= now && w[1] > now) {
        if (!this.opened.has(key)) { this.opened.add(key); if (this.on) this.fire(f, spot, w[1]); }
      }
    }
    if (this.opened.size > 400) this.opened.clear();
  },
};

/** タブのタイトルに、いちばん近い★の窓までの残り時間を出す */
function updateTitle() {
  const base = state.lang === 'ja' ? 'エオルゼア釣り図鑑' : 'Eorzean Fish Guide';
  if (!state.favs.size) { document.title = base; return; }
  let bestOpen = null, bestSoon = null;
  const now = Date.now();
  for (const id of state.favs) {
    const f = DB.fish[id];
    if (!f) continue;
    const spot = spotById.get(f.nushiSpot ?? f.spots[0]);
    const ws = nushiWindows(f, spot?.territoryId ?? null);
    if (ws === 'always') continue;
    const w = nextWindow(ws);
    if (!w) continue;
    if (w[0] <= now) { if (!bestOpen || w[1] < bestOpen[1]) bestOpen = w; }
    else if (!bestSoon || w[0] < bestSoon[0]) bestSoon = w;
  }
  if (bestOpen) document.title = `● ${remainText(mins(now, bestOpen[1]))} — ${base}`;
  else if (bestSoon) document.title = `${relText(bestSoon[0])} — ${base}`;
  else document.title = base;
}

/* ══════════════════════════════════════════════════════════
   ヌシ・オオヌシ一覧
   ══════════════════════════════════════════════════════════ */
const fmtMin = (m) => {
  if (m < 60) return `${m}${T('minutes')}`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}${T('hoursU')}${m % 60 ? (m % 60) + T('minutes') : ''}`;
  return `${Math.floor(h / 24)}${T('days')}${h % 24 ? (h % 24) + T('hoursU') : ''}`;
};
/**
 * 相対時間。1分ごとの再描画だと最大60秒ずれるので、
 * data-cd を付けて毎秒この場で書き換える。
 */
function relText(ms) {
  const d = ms - Date.now();
  if (d <= 0) return T('soon');
  const sec = Math.floor(d / 1000);
  if (sec < 60) return `${T('ago')}${sec}${T('secU')}`;
  const m = Math.floor(sec / 60);
  if (m < 60) return `${T('ago')}${m}${T('minutes')}${sec % 60}${T('secU')}`;
  return T('ago') + fmtMin(m);
}
const relTime = (ms) => `<span data-cd="${ms}" data-cdk="rel">${relText(ms)}</span>`;
function tickCountdowns() {
  for (const el of document.querySelectorAll('[data-cd]')) {
    const at = Number(el.dataset.cd);
    el.textContent = el.dataset.cdk === 'rem' ? remainText(mins(Date.now(), at)) : relText(at);
  }
}
const absTime = (ms) => `${md(ms)} ${hhmm(ms)}`;
/** 「〜まで」「until 〜」の語順を言語に合わせる */
const untilText = (ms) => (state.lang === 'ja' ? `${absTime(ms)} まで` : `until ${absTime(ms)}`);
/** 「残り 5分」「5min left」 */
function remainText(m) {
  const t = m < 60 ? `${m}${T('minutes')}` : fmtMin(m);
  return state.lang === 'ja' ? `残り ${t}` : `${t} left`;
}
const remainTag = (ms) => `<span data-cd="${ms}" data-cdk="rem">${remainText(mins(Date.now(), ms))}</span>`;

function condChips(f, spotId) {
  const c = [];
  const d = condOf(f);
  const guess = !!f.derived;
  if (guess) {
    const p = DB.fish[f.derived.fromPredator];
    c.push(`<span class="wchip guess" title="${esc(nm(p?.n))}${T('fromPredator')}">⚠ ${T('estimated')}</span>`);
  }
  if (f.condManual && f.condVerified === false) {
    c.push(`<span class="wchip guess" title="${T('unverifiedTip')}">⚠ ${T('unverified')}</span>`);
  }
  if (d.startHour !== 0 || d.endHour !== 24) c.push(`<span class="wchip">ET ${etShort(d.startHour)}–${etShort(d.endHour)}</span>`);
  d.prevWeather.forEach((w) => c.push(`<span class="wchip prev">${T('prev')}${wIcon(w)}${esc(wName(w))}</span>`));
  d.weather.forEach((w) => c.push(`<span class="wchip">${wIcon(w)}${esc(wName(w))}</span>`));
  if (f.predators.length) c.push(`<span class="wchip" style="color:var(--gold)">${T('intuition')}</span>`);
  if (f.folklore) c.push(`<span class="wchip" style="color:var(--violet)">${T('folklore')}</span>`);
  if (f.snagging) c.push(`<span class="wchip">${T('snagging')}</span>`);
  if (f.lure) c.push(`<span class="wchip lurechip">${lureTag(f)}${esc(nm(f.lure))}</span>`);
  if (!c.length) c.push(`<span class="any">${f.oonushi ? T('condUnknown') : T('anytime')}</span>`);
  return `<div class="ncond">${c.join('')}</div>`;
}

/**
 * 選んだヌシだけを実時間で並べたタイムライン。
 * 期間を切り替えられ、目盛りと現在位置を出す。
 */
const TL_RANGES = [12, 24, 48, 168];
function favTimelineHTML() {
  const hours = state.tlHours;
  const head = (body) => `<details class="gantt tl" ${state.tlOpen ? 'open' : ''} id="tl">
    <summary>${T('timeline')}<span class="tlcount">${state.favs.size}${T('fishUnit')}</span>
      <span class="tlrange">${TL_RANGES.map((h) => `<button class="chipbtn sm" data-tl="${h}"
        aria-pressed="${h === hours}">${h < 168 ? h + 'h' : (state.lang === 'ja' ? '7日' : '7d')}</button>`).join('')}</span>
    </summary>
    <div class="gbody">${body}</div></details>`;

  if (!state.favs.size) {
    return head(`<div class="gempty">${state.lang === 'ja'
      ? '行の左の ☆ を押すと、その魚だけをここに並べます。追いかけているヌシを数匹選んでおくと、次にどれが来るか一目で分かります。'
      : 'Star a row below to pin it here. Pick the few you are chasing and you can see at a glance which comes next.'}</div>`);
  }

  const t0 = Date.now(), span = hours * 3600 * 1000;
  // 目盛り。24時間以内なら3時間おき、それ以上なら日付の変わり目に寄せる
  const stepH = hours <= 12 ? 2 : hours <= 24 ? 4 : hours <= 48 ? 8 : 24;
  const axis = [];
  for (let i = 0; i <= hours; i += stepH) {
    const t = t0 + i * 3600 * 1000;
    axis.push(`<span style="left:${(i / hours) * 100}%">${i === 0 ? 'now' : (hours > 24 ? dayLabel(t) : '') + hhmm(t)}</span>`);
    if (i > 0 && i < hours) axis.push(`<i style="left:${(i / hours) * 100}%"></i>`);
  }

  const list = [...state.favs].map((id) => DB.fish[id]).filter(Boolean);
  const rows = list.map((f) => {
    const spot = spotById.get(f.nushiSpot ?? f.spots[0]);
    const wsR = findWindows(f, spot?.territoryId ?? null,
      { days: hours / 24, limit: 400, fishEyes: state.fishEyes });
    const ws = wsR === 'always' ? [[t0, t0 + span]] : wsR;
    const first = ws.find(([, b]) => b > t0);
    const bars = ws.map(([a, b]) => {
      const l = Math.max(0, (a - t0) / span) * 100;
      const w = Math.max(0.35, ((b - a) / span) * 100);
      const live = a <= t0 + 1000 && b > t0;
      return `<div class="gbar${live ? ' now' : ''}" style="left:${l}%;width:${Math.min(w, 100 - l)}%"
        title="${dayLabel(a)}${hhmm(a)}–${hhmm(b)} (${fmtMin(mins(a, b))})"></div>`;
    }).join('');
    const live = first && first[0] <= t0 + 1000;
    return `<div class="grow${live ? ' on' : ''}">
      <div class="gname" data-fish="${f.id}" data-fishspot="${spot?.id ?? ''}" title="${esc(nm(spot?.n))}">
        <span class="dot${f.oonushi ? ' oo' : ''}"></span>${esc(nm(f.n))}</div>
      <div class="gtrack">${bars}<div class="gnow"></div></div>
      <div class="gwhen">${!first ? '—'
        : live ? `<b class="live">${remainTag(first[1])}</b>`
        : `<span class="rel">${relTime(first[0])}</span>`}</div>
      <button class="fav mini" data-fav="${f.id}" aria-pressed="true" aria-label="remove">★</button>
    </div>`;
  }).join('');
  return head(`<div class="gaxis">${axis.join('')}</div>${rows}`);
}

function renderNushi(keepScroll = false) {
  const scrollY = keepScroll ? $('#stage').scrollTop : 0;
  const now = Date.now();
  const nf = state.nf;
  const allNushi = Object.values(DB.fish).filter((f) => f.nushi);

  // ET の昼夜。窓の時間帯がその帯にかかるかで見る
  const overlapsBand = (f, band) => {
    const d = condOf(f);
    if (d.startHour === 0 && d.endHour === 24) return true;
    const hit = (h) => inHourRange(h, d.startHour, d.endHour);
    const hours = band === 'day' ? [6, 9, 12, 15] : [18, 21, 0, 3];
    return hours.some(hit);
  };

  let list = nf.scope === 'all' ? Object.values(DB.fish) : allNushi;
  if (nf.kind === 'oonushi') list = list.filter((f) => f.oonushi);
  if (nf.kind === 'nushi') list = list.filter((f) => f.nushi && !f.oonushi);
  if (nf.ex !== 'all') list = list.filter((f) => Math.floor(f.patch || 0) === Number(nf.ex));
  if (nf.ver !== 'all') list = list.filter((f) => f.patch == nf.ver);
  if (nf.intuition !== 'any') list = list.filter((f) => (nf.intuition === 'yes') === !!f.predators.length);
  if (nf.weather !== 'any') list = list.filter((f) => (nf.weather === 'yes') === !!condOf(f).weather.length);
  if (nf.band !== 'any') list = list.filter((f) => overlapsBand(f, nf.band));
  if (nf.rare === 'rare') {
    list = list.filter((f) => {
      const sp = spotById.get(f.nushiSpot ?? f.spots[0]);
      const u = uptime(f, sp?.territoryId ?? null);
      return u != null && u < 2;
    });
  }
  if (nf.status.has('fav')) list = list.filter((f) => state.favs.has(f.id));
  if (nf.status.has('uncaught')) list = list.filter((f) => !state.caught.has(f.id));

  // 状態は4つ。open=いま釣れる / soon=次の窓が決まっている / always=時間も天候も不問 / none=不明
  const rows = list.map((f) => {
    const spot = spotById.get(f.nushiSpot ?? f.spots[0]);
    const ws = nushiWindows(f, spot?.territoryId ?? null);
    const w = nextWindow(ws);
    // 次々回。予定を立てるときに効く
    const next2 = ws !== 'always' && w ? ws[ws.indexOf(w) + 1] ?? null : null;
    const up = uptime(f, spot?.territoryId ?? null);
    let st = 'none';
    if (!f.hasConditions) st = 'unknown';
    else if (w === 'always') st = 'always';
    else if (w) st = w[0] <= now + 1000 ? 'open' : 'soon';
    return { f, spot, w, next2, up, st, live: st === 'open' || st === 'always' };
  });

  if (state.liveOnly || nf.status.has('open')) rows.splice(0, rows.length, ...rows.filter((r) => r.live));
  const ORDER = { open: 0, soon: 1, always: 2, none: 3, unknown: 4 };
  rows.sort((a, b) => {
    if (state.nushiSort === 'name') return nm(a.f.n).localeCompare(nm(b.f.n), state.lang);
    if (state.nushiSort === 'patch') {
      return (a.f.patch ?? 99) - (b.f.patch ?? 99) || nm(a.f.n).localeCompare(nm(b.f.n), state.lang);
    }
    if (state.nushiSort === 'uptime') return (a.up ?? 101) - (b.up ?? 101);
    if (ORDER[a.st] !== ORDER[b.st]) return ORDER[a.st] - ORDER[b.st];
    if (a.st === 'open') return a.w[1] - b.w[1];        // 締切が近い順
    if (a.st === 'soon') return a.w[0] - b.w[0];        // 始まるのが早い順
    return nm(a.f.n).localeCompare(nm(b.f.n), state.lang);
  });

  const patches = [...new Set(allNushi.map((f) => Math.floor(f.patch || 0)))].sort((a, b) => a - b);
  // 拡張を選んでいればその中のパッチだけ、選んでいなければ全部
  const vers = [...new Set(allNushi
    .filter((f) => nf.ex === 'all' || Math.floor(f.patch || 0) === Number(nf.ex))
    .map((f) => f.patch).filter(Boolean))].sort((a, b) => a - b);
  // 拡張名はデータ側の4言語をそのまま使う（略記はいちばん目立つ語だけ）
  const shortEx = (n) => (state.lang === 'ja' ? n.replace(/(のイシュガルド|のリベレーター|のヴィランズ|のフィナーレ|のレガシー|エオルゼア)$/, '') : n);
  const EXP = {};
  for (const p of patches) {
    const e = DB.expansions[p - 2];          // パッチ 2.x = 新生（拡張ID 0）
    EXP[p] = e ? shortEx(nm(e.n)) : `P${p}`;
  }

  const liveNow = rows.filter((r) => r.st === 'open').length;

  // 効いている絞り込みの数と、外せるチップ
  const DEFAULTS = { scope: 'nushi', kind: 'all', ex: 'all', ver: 'all',
                     intuition: 'any', weather: 'any', band: 'any', rare: 'any' };
  const LABELS = { scope: T('scope'), kind: T('kind'), ex: T('expansion'), ver: T('patch'),
                   intuition: T('intuition'), weather: T('weather'), band: T('band'), rarity: T('rarity'),
                   rare: T('rarity') };
  const VAL = { yes: T('need'), no: T('noNeed'), restricted: T('restricted'), day: T('dayBand'),
                night: T('nightBand'), nushi: T('nushiOne'), oonushi: T('oonushi'),
                open: T('open'), fav: '★', uncaught: T('uncaughtOnly'),
                rare: T('rare'), all: T('allFish') };
  const chips = [];
  for (const [k, d] of Object.entries(DEFAULTS)) {
    if (nf[k] === d) continue;
    const v = k === 'ex' ? (EXP[nf[k]] ?? nf[k]) : (VAL[nf[k]] ?? nf[k]);
    chips.push(`<button class="fchip" data-nfclear="${k}">${LABELS[k]}: ${esc(String(v))} ×</button>`);
  }
  for (const t of nf.status) chips.push(`<button class="fchip" data-nfclear="status:${t}">${VAL[t] ?? t} ×</button>`);
  const activeCount = chips.length;
  const activeChips = chips.join('');

  const fgroup = (label, key, opts, multi = false) => `<div class="fgrp">
    <span class="flabel">${label}</span>
    <div class="fopts">${opts.map(([v, l]) => {
      const on = multi ? nf[key].has(v) : nf[key] === v;
      return `<button class="chipbtn sm" data-nfk="${key}" data-nfv="${v}" data-nfm="${multi ? 1 : 0}"
        aria-pressed="${on}">${esc(l)}</button>`;
    }).join('')}</div>
  </div>`;
  const alwaysN = rows.filter((r) => r.st === 'always').length;

  $('#stage').innerHTML = `<div class="wrap">
    <div class="spot-head">
      <h1>ヌシ・オオヌシ</h1>
      <div class="meta">${DB.meta.nushiCount} 匹（うちオオヌシ <b>${DB.meta.oonushiCount}</b>）· 釣れる時間を最大400日先まで探索</div>
    </div>
    <div class="eyebrow">BIG FISH — NEXT WINDOWS</div>
    ${favTimelineHTML()}

    <div class="ctlbar">
      <label class="sel">
        <span>${T('sortBy')}</span>
        <select id="nsort">
          ${[['next', T('byNext')], ['uptime', T('byUptime')], ['patch', T('byPatch')], ['name', T('byName')]]
            .map(([v, l]) => `<option value="${v}"${state.nushiSort === v ? ' selected' : ''}>${l}</option>`).join('')}
        </select>
      </label>
      <button class="ctlbtn${activeCount ? ' on' : ''}" id="nfilter" aria-expanded="${state.nfOpen}">
        ${T('filter')}${activeCount ? ` <b>${activeCount}</b>` : ''} <i>${state.nfOpen ? '▲' : '▼'}</i>
      </button>
      <span class="ctlcount">${rows.length} / ${allNushi.length}${
        liveNow ? ` · <b class="live">${T('open')} ${liveNow}</b>` : ''}</span>
      <span class="ctlacts">
        <button class="chipbtn star" data-favall="1">★ ${T('selectAll')}</button>
        <button class="chipbtn check" data-caughtall="1">✔ ${T('caughtAll')}</button>
      </span>
    </div>

    ${activeCount ? `<div class="activef">${activeChips}</div>` : ''}

    ${state.nfOpen ? `<div class="fpanel">
      ${fgroup(T('scope'), 'scope', [['nushi', T('nushi')], ['all', T('allFish')]])}
      ${fgroup(T('kind'), 'kind', [['all', T('all')], ['nushi', T('nushiOne')], ['oonushi', T('oonushi')]])}
      ${fgroup(T('status'), 'status', [['open', T('open')], ['fav', '★'], ['uncaught', T('uncaughtOnly')]], true)}
      ${fgroup(T('expansion'), 'ex', [['all', T('all')], ...patches.map((p) => [String(p), EXP[p] ?? 'P' + p])])}
      ${nf.ex !== 'all' && vers.length > 1 ? fgroup(T('patch'), 'ver', [['all', T('all')], ...vers.map((v) => [String(v), String(v)])]) : ''}
      ${fgroup(T('intuition'), 'intuition', [['any', T('all')], ['yes', T('need')], ['no', T('noNeed')]])}
      ${fgroup(T('rarity'), 'rare', [['any', T('all')], ['rare', T('rare')]])}
      ${fgroup(T('weather'), 'weather', [['any', T('all')], ['yes', T('restricted')], ['no', T('anyWeather')]])}
      ${fgroup(T('band'), 'band', [['any', T('all')], ['day', T('dayBand')], ['night', T('nightBand')]])}
      <div class="fgrp fend">
        <button class="chipbtn" data-nfreset="1">${T('reset')}</button>
      </div>
    </div>` : ''}

    <div class="nhead">
      <div>${T('kind')}</div><div>${T('fish')}</div><div>${T('next')}</div>
      <div>${T('spot')}</div><div>${T('cond')}</div><div>${T('bait')}</div>
    </div>
    <div>${rows.map(({ f, spot, w, next2, up, st }) => `
      <div class="nrow${st === 'open' ? ' open' : ''}${st === 'always' ? ' always' : ''}${
        state.caught.has(f.id) ? ' done' : ''}${up != null && up < 2 ? ' rare' : ''}" data-fish="${f.id}" data-fishspot="${spot?.id ?? ''}" tabindex="0" role="button">
        <div class="nkind">${favBtn(f.id)}${caughtBtn(f.id)}<span class="kind${f.oonushi ? ' oo' : ''}">${f.oonushi ? T('oonushi') : T('nushiOne')}</span></div>
        <div class="nname">${iconImg(f, 'ficon sm')}<span class="nm">${esc(nm(f.n))}</span>
          ${lureTag(f)}
          ${f.patch ? `<span class="patch">${f.patch}</span>` : ''}
          ${f.fishEyes && state.fishEyes ? '<span class="tag coll">FE</span>' : ''}</div>
        <div class="nnext">${
          st === 'unknown' ? `<span class="never">${T('condMissing')}</span>`
          : st === 'always' ? `<span class="${f.oonushi ? 'never' : 'anytime'}">${
              f.oonushi ? T('condUnknown') : T('anytime')}</span>`
          : st === 'open' ? `<span class="live">${T('nowBiting')}</span><br><span class="rel">${untilText(w[1])} · ${remainTag(w[1])}</span>`

          : `<span class="never">${T('notFound')}</span>`}
          ${next2 ? `<br><span class="rel dim">${T('then')} ${absTime(next2[0])}</span>` : ''}
          ${up != null && up < 100 ? `<br>${uptimeTag(up)}` : ''}</div>
        <div class="nspot">${spot
          ? `<span class="spotlink" role="link" tabindex="0" data-gospot="${spot.id}">${esc(nm(spot.n))}</span>${
              spot.mapId != null ? `<span class="mapbtn" data-map="${spot.id}" title="${T('showMap')}">◎</span>` : ''}`
          : '—'}<small>${esc(nm(spot?.area))}</small></div>
        ${condChips(f, spot?.id)}
        <div class="nbait">${baitHTML(f, spot?.id)}${(() => {
          const b = spot ? bestBite(f.id, spot.id, baitKey(f.baitPath[f.baitPath.length - 1])) : null;
          return b?.lo != null ? `<span class="wchip bite">${b.lo}–${b.hi}s</span>` : '';
        })()}</div>
      </div>`).join('') ||
      `<div class="gempty" style="padding:26px 12px">${state.lang === 'ja' ? '条件に合うヌシがいません。' : 'No big fish match.'}</div>`}
    </div>
    ${creditHTML()}
  </div>`;
  $('#stage').scrollTop = scrollY;
}


/* ══════════════════════════════════════════════════════════
   オーシャンフィッシング
   便は UTC の2時間ちょうどごとに出る。144便で12日かけて一周し、
   どの便がどの航路かはゲームの運行表から決まる。
   ══════════════════════════════════════════════════════════ */
const VOYAGE_SEC = 7200;
const chunkOf = (ms) => Math.floor(ms / 1000 / VOYAGE_SEC);
const voyageAt = (chunk) => {
  const [i, r] = DB.ocean.table[(chunk + DB.ocean.phase) % DB.ocean.table.length];
  return { indigo: DB.ocean.routes[i], ruby: DB.ocean.routes[r] };
};

// 時間帯コード 1=夜 2=昼 3=夕
const TIME_KEY = { 1: 'night', 2: 'day', 3: 'sunset' };
const TIME_CLS = { 1: 'tn', 2: 'td', 3: 'ts' };
const timeLabel = (t) => T(TIME_KEY[t] ?? 'day');

function stopsHTML(route) {
  if (!route) return '<span class="odim">—</span>';
  // 幻海流に入ると釣れる魚がまるごと入れ替わるので、寄港地ごとに両方へ行けるようにする
  return route.stops.map((st) => `<span class="ostopwrap">
    <span class="ostop${st.spotId ? '' : ' plain'}" ${st.spotId ? `data-spot="${st.spotId}"` : ''}
      title="${T('normal')}">${esc(nm(st.n))}<i class="${TIME_CLS[st.time] ?? 'td'}">${timeLabel(st.time)}</i></span>
    ${st.subSpotId ? `<span class="ospec" data-spot="${st.subSpotId}" title="${T('spectral')}">${state.lang === 'ja' ? '幻' : 'S'}</span>` : ''}
  </span>`).join('<span class="oarrow">→</span>');
}

/**
 * その便で狙える魚。寄港地の時間帯と、魚が要求する時間帯が合ったものだけ。
 * 幻海流の魚は幻海流の釣り場から拾う。
 */
function voyageTargets(route) {
  if (!route) return { legend: [], timed: [] };
  const legend = [], timed = [];
  for (const st of route.stops) {
    for (const sid of [st.spotId, st.subSpotId]) {
      const sp = sid != null ? spotById.get(sid) : null;
      if (!sp) continue;
      for (const id of sp.fishes) {
        const f = DB.fish[id];
        if (!f) continue;
        // 時間指定のある魚は、その寄港地の時間帯と一致するときだけ狙える
        if (f.oceanTimes && !f.oceanTimes.includes(st.time)) continue;
        if (f.oceanLegend) legend.push({ f, sp, st });
        else if (f.oceanTimes) timed.push({ f, sp, st });
      }
    }
  }
  return { legend, timed };
}

/**
 * その便で狙えるボーナス条件（称号）。
 *
 * 3つの寄港地（通常＋幻海流）を合計し、同じ魚は一度だけ数える。
 * そのうえで「その称号にとって対象魚がいちばん多い航路」だけを狙い目として出す。
 * どの便でも同じ称号が並ぶと選ぶ意味がなくなるため、最良の便に絞る。
 */
function voyageBonuses(route) {
  if (!route) return [];
  const seen = new Set();
  const groups = new Map();
  for (const st of route.stops) {
    for (const sid of [st.spotId, st.subSpotId]) {
      const sp = sid != null ? spotById.get(sid) : null;
      if (!sp) continue;
      for (const id of sp.fishes) {
        const f = DB.fish[id];
        if (!f?.oceanBonus) continue;
        // 寄港地の時間帯に合わない魚は数えない
        if (f.oceanTimes && !f.oceanTimes.includes(st.time)) continue;
        if (seen.has(id)) continue;
        seen.add(id);
        for (const b of f.oceanBonus) {
          const key = b.n.ja;
          if (!groups.has(key)) groups.set(key, { key, n: b.n, party: b.party, fish: [] });
          groups.get(key).fish.push(f);
        }
      }
    }
  }
  return [...groups.values()].sort((a, b) => b.fish.length - a.fish.length);
}

/** 称号ごとの最高種類数。全航路を一度だけ数えて使い回す */
let bonusBest = null;
function bonusBestCounts() {
  if (bonusBest) return bonusBest;
  bonusBest = new Map();
  for (const r of Object.values(DB.ocean.routes)) {
    for (const g of voyageBonuses(r)) {
      bonusBest.set(g.key, Math.max(bonusBest.get(g.key) ?? 0, g.fish.length));
    }
  }
  return bonusBest;
}

/** 高得点の狙いやすさ。S+ 〜 D の評価を出す */
function rankTag(route) {
  if (!route?.rank) return '';
  const lv = { 'S+': 3, S: 3, 'A+': 2, A: 2, B: 1 }[route.rank] ?? 0;
  if (!lv) return `<span class="rank r0" title="${T('rankTip')}">${route.rank}</span>`;
  return `<span class="rank r${lv}" title="${T('rankTip')}">${route.rank}${
    lv === 3 ? ` ${T('highScore')}` : ''}</span>`;
}

function bonusChips(route) {
  const best = bonusBestCounts();
  // その称号にとって対象魚がいちばん多い航路だけを「狙える」として出す
  const hit = voyageBonuses(route).filter((g) => g.fish.length === best.get(g.key));
  if (!hit.length) return '';
  return `<div class="obonus">
    <span class="oblabel">${T('bonusAim')}</span>
    ${hit.map((g) => `<span class="obchip${g.party ? ' party' : ''}"
      title="${esc(g.fish.map((f) => nm(f.n)).join('、'))}">${esc(nm(g.n))}<i>${g.fish.length}</i></span>`).join('')}
  </div>`;
}

function targetChips(route) {
  const { legend, timed } = voyageTargets(route);
  if (!legend.length && !timed.length) return '';
  const chip = (x, cls) => {
    const b = baitPathByRate(x.f.id, x.sp.id);
    const label = b ? b.path.map(baitName).join(' ▸ ') : '';
    return `<span class="otgt ${cls}" data-fish="${x.f.id}" data-fishspot="${x.sp.id}"
      title="${esc(nm(x.sp.n))} / ${timeLabel(x.st.time)}${b ? ` / ${esc(label)} ${b.rate}%` : ''}">
      ${iconImg(x.f, 'otgticon')}${esc(nm(x.f.n))}${
      x.f.oceanTimes ? `<b class="ot-t">${x.f.oceanTimes.map(timeLabel).join('/')}</b>` : ''}</span>`;
  };
  return `<div class="otargets">
    ${legend.map((x) => chip(x, 'legend')).join('')}
    ${timed.map((x) => chip(x, 'timed')).join('')}
  </div>`;
}

/**
 * 称号の一覧。達成条件と得点倍率はゲームデータから、
 * 具体的な釣り方は書き手の方の記事へのリンクで代える。
 */
function bonusGuideHTML() {
  const best = bonusBestCounts();
  const info = DB.ocean.bonuses ?? {};
  // 称号として狙えるもの（魚が紐づいているもの）だけを出す
  const list = Object.values(info).filter((b) => best.has(b.n.ja))
    .sort((a, b) => (best.get(b.n.ja) ?? 0) - (best.get(a.n.ja) ?? 0));
  if (!list.length) return '';

  // 各称号の最良航路
  const bestRoutes = new Map();
  for (const r of Object.values(DB.ocean.routes)) {
    for (const g of voyageBonuses(r)) {
      if (g.fish.length !== best.get(g.key)) continue;
      if (!bestRoutes.has(g.key)) bestRoutes.set(g.key, []);
      bestRoutes.get(g.key).push(r);
    }
  }

  const link = (g) => `<a class="glink" href="${esc(g.url)}" target="_blank" rel="noopener noreferrer"
    >${esc(g.title)}<small>${esc(g.author)}</small></a>`;

  return `<details class="gantt" ${state.guideOpen ? 'open' : ''} id="bguide">
    <summary>${T('titles')}<span class="eyebrow">${list.length}</span></summary>
    <div class="gbody">
      <div class="btitles">${list.map((b) => `
        <div class="btitle">
          <div class="bt-head">
            <span class="obchip">${esc(nm(b.n))}</span>
            <span class="bt-mul">×${(b.multiplier / 100).toFixed(2).replace(/0$/, '')}</span>
          </div>
          <div class="bt-req">${esc(nm(b.req))}</div>
          <div class="bt-route">${(bestRoutes.get(b.n.ja) ?? []).map((r) =>
            `<span class="wchip">${esc(nm(r.n))}（${esc(timeLabel(r.destTime))}）</span>`).join('')}
            <span class="wchip bite">${best.get(b.n.ja)}${T('fishUnit')}</span></div>
          ${b.guides?.length ? `<div class="bt-links">${b.guides.map(link).join('')}</div>` : ''}
        </div>`).join('')}</div>
      ${DB.ocean.guides?.length ? `<div class="bt-general">
        <span class="eyebrow">${T('generalGuides')}</span>
        ${DB.ocean.guides.map(link).join('')}</div>` : ''}
      <p class="bnote">${T('guideNote')}</p>
    </div>
  </details>`;
}

      </div>
      <div class="dc-time">${
        !w ? `<span class="anytime">${T('anytime')}</span>`
        : w[0] <= now ? `<b class="live">${T('nowBiting')}</b><br><span class="rel">${remainTag(w[1])}</span>`

    </div>`;

  $('#stage').innerHTML = `<div class="wrap dash">

      <h1>${T('dashTitle')}</h1>
      <div class="meta">${DB.meta.spotCount} ${T('spot')} · ${DB.meta.fishCount} ${T('fish')} · ${DB.meta.nushiCount} ${T('nushi')}</div>
    </div>

    <section class="dsec">
      <h2>${T('dashOpen')} <span class="cnt">${open.length}</span></h2>
      <div class="dgrid">${open.slice(0, 12).map((x) => card(x, true)).join('')
        || `<p class="gempty">${T('dashNone')}</p>`}</div>
      ${open.length > 12 ? `<button class="chipbtn" id="dash-more">${T('nushi')} →</button>` : ''}
    </section>

    ${favs.length ? `<section class="dsec">
      <h2>${T('dashFav')} <span class="cnt">${favs.length}</span></h2>
      <div class="dgrid">${favs.slice(0, 12).map((x) => card(x, x.w && x.w[0] <= now)).join('')}</div>
    </section>` : ''}

    <section class="dsec">
      <h2>${T('dashOcean')}</h2>
      <div class="dvoy">${voy.map(({ dep, v }) => `
        <div class="dv">
          <div class="dv-t"><b>${dayLabel(dep)}${hhmm(dep)}</b> <span class="rel">${relTime(dep)}</span></div>
          <div class="dv-r"><span class="oname indigo">${esc(nm(v.indigo?.n))}
            <em>${v.indigo ? esc(timeLabel(v.indigo.destTime)) : ''}</em></span>${rankTag(v.indigo)}
            ${bonusChips(v.indigo)}${targetChips(v.indigo)}</div>
          <div class="dv-r"><span class="oname ruby">${esc(nm(v.ruby?.n))}
            <em>${v.ruby ? esc(timeLabel(v.ruby.destTime)) : ''}</em></span>${rankTag(v.ruby)}
            ${bonusChips(v.ruby)}${targetChips(v.ruby)}</div>
        </div>`).join('')}</div>

/* ══════════════════════════════════════════════════════════
   魚の詳細ドロワー

function openFish(fishId, fromSpotId) {
  const f = DB.fish[fishId];
  if (!f) return;
  const spot = spotById.get(fromSpotId ?? f.spots[0]);
  const terr = spot?.territoryId ?? null;

  const wsRaw = f.nushi ? nushiWindows(f, terr) : findWindows(f, terr, { days: 3, limit: 8, fishEyes: state.fishEyes });
  const ws = wsRaw === 'always' ? [] : wsRaw;
  const always = wsRaw === 'always';
  const winHTML = always
    ? '<p style="color:var(--glow);font-size:12.5px">時間帯・天候の制約なし。いつ行っても抽選対象。</p>'
    : ws.length ? ws.map(([a, b], i) => `
    <div class="win${i === 0 && a <= Date.now() ? ' active' : ''}">
      <time>${dayLabel(a)}${hhmm(a)} – ${dayLabel(b)}${hhmm(b)}</time>
      <span class="dur">${fmtMin(mins(a, b))}</span></div>`).join('')
    : '<p style="color:var(--dim);font-size:12px">72時間以内にウィンドウなし、または条件が未判明です。</p>';

  // ヒットタイム：この釣り場でのエサ別実測
  const bites = ((spot && biteIndex.get(spot.id)?.get(f.id)) ?? [])
    .slice().sort(((c) => (a, b) => c(a.baitId, b.baitId))(baitOrderFor(!!spot?.ocean)));
  const key = `${spot?.id ?? 0}:${f.id}:${baitKey(f.baitPath[f.baitPath.length - 1]) ?? 0}`;
  const snippet = `"${key}": { "lo": 0, "hi": 0, "n": 1 }`;

  const biteSec = bites.length ? `
    <table class="btab">
      <thead><tr><th>${T('baitCol')}</th><th>${T('biteSec')}</th><th>${T('chumCol')}</th><th>${T('rate')}</th><th>${T('rivals')}</th><th>${T('samples')}</th></tr></thead>
      <tbody>${(() => {
      const hs = bites.map((b) => unpackHist(b.h));
      const dmax = Math.ceil(Math.max(20, ...bites.map((b) => b.hi ?? 0),
        ...hs.map((h) => (h ? (h.start + h.v.length) * HIST_BIN : 0))) / 5) * 5;
      return bites.map((b, bi) => {
        const h = hs[bi];
        return `<tr>
          <td>${esc(baitName(b.baitId))}</td>
          <td class="num"><b>${b.lo ?? '—'}${b.hi != null ? '–' + b.hi : ''}</b>${b.lo != null ? '<span class="unit">s</span>' : ''}

          <td class="num dim">${spot ? competitionOf(spot.id, b.baitId) : '—'}</td>

          <dt>${T('tug')}</dt><dd>${f.tugJa ?? '—'}${f.hookset ? ` ／ ${esc(nm(f.hookset))}` : ''}

          ${f.gig ? `<dt>${T('shadow')}</dt><dd>${T('shadow' + f.gig)}${

          ${(f.craft || f.gc || f.collectable) ? `<dt>${T('uses')}</dt><dd>${[

          ${f.oceanPoints != null ? `<dt>${T('points')}</dt><dd>${f.oceanPoints}${T('ptsUnit')}${
            f.oceanMulti != null ? ` / ${T('multiHook')} ×${f.oceanMulti}` : ''}</dd>` : ''}
          ${f.oceanBonus ? `<dt>${T('bonus')}</dt><dd>${f.oceanBonus.map((b) => esc(nm(b.n))).join('<br>')}</dd>` : ''}

function closeDrawer() {
  $('#drawer').classList.remove('open');

/* ══════════════════════════════════════════════════════════
   ルーティング & イベント
   ══════════════════════════════════════════════════════════ */
function render() {
  if (state.query.trim()) { state.view = 'search'; return renderSearch(); }
  if (state.view === 'nushi') return renderNushi();
  if (state.view === 'ocean') return renderOcean();
  return renderSpot();
}
function selectSpot(id) {
  state.view = 'spot';
  state.spotId = Number(id);
  state.query = '';
  $('#q').value = '';
  const sp = spotById.get(state.spotId);
  if (sp) { state.openAreas.add(sp.area.ja); state.openEx.add(String(sp.ex)); }
  syncHash(true);
  renderSide();
  render();
  closeDrawer();
  $('#side').classList.remove('open');
  $('#scrim').classList.remove('side');
}

document.addEventListener('click', (e) => {
  const areaBtn = e.target.closest('.area > summary');
  if (areaBtn) {
    const d = areaBtn.parentElement;
    setTimeout(() => d.open ? state.openAreas.add(d.dataset.area) : state.openAreas.delete(d.dataset.area), 0);
  }
  const bgSum = e.target.closest('#bguide > summary');
  if (bgSum) setTimeout(() => (state.guideOpen = $('#bguide').open), 0);
  const tlSum = e.target.closest('#tl > summary');
  if (tlSum && !e.target.closest('[data-tl]')) setTimeout(() => (state.tlOpen = $('#tl').open), 0);
  const exBtn = e.target.closest('.exp > summary');
  if (exBtn) {
    const d = exBtn.parentElement;
    setTimeout(() => d.open ? state.openEx.add(d.dataset.ex) : state.openEx.delete(d.dataset.ex), 0);
  }
  if (e.target.closest('#home')) {
    state.view = 'welcome'; state.spotId = null; state.query = ''; $('#q').value = '';
    syncHash(true); renderSide(); renderWelcome(); closeDrawer();
    $('#side').classList.remove('open');
    return;
  }
  if (e.target.closest('#nav-nushi')) {
    state.view = 'nushi'; state.query = ''; $('#q').value = '';
    syncHash(true); renderSide(); render(); closeDrawer();
    $('#side').classList.remove('open');
    return;
  }
  if (e.target.closest('#dash-more')) {
    state.view = 'nushi'; syncHash(true); renderSide(); render(); return;
  }
  if (e.target.closest('#nav-ocean')) {
    state.view = 'ocean'; state.query = ''; $('#q').value = '';
    syncHash(true); renderSide(); render(); closeDrawer();
    $('#side').classList.remove('open'); $('#scrim').classList.remove('side');
    return;
  }
  const od = e.target.closest('[data-od]');
  if (od) { state.oceanDest = od.dataset.od; renderOcean(); return; }
  if (e.target.closest('[data-ot]')) { state.oceanTargets = !state.oceanTargets; renderOcean(); return; }
  if (e.target.closest('[data-ol]')) { state.oceanLegendOnly = !state.oceanLegendOnly; renderOcean(); return; }
  const gs = e.target.closest('[data-gospot]');
  if (gs) { e.stopPropagation(); selectSpot(gs.dataset.gospot); return; }
  const ml = e.target.closest('[data-map]');
  if (ml) {
    e.stopPropagation();
    const sp = spotById.get(Number(ml.dataset.map));
    if (sp) openMap(sp);
    return;
  }
  if (e.target.closest('#spotmap')) {
    const sp = spotById.get(state.spotId);
    if (sp) openMap(sp);
    return;
  }
  if (e.target.closest('#showmap')) {
    const sp = spotById.get(state.spotId);
    if (sp) openMap(sp);
    return;
  }
  const fv = e.target.closest('[data-fav]');
  if (fv) {
    e.stopPropagation();
    const id = Number(fv.dataset.fav);
    toggleFav(id);
    // 詳細パネルを開いたまま押されたときは、そのボタンだけ描き直す
    const on = state.favs.has(id);
    document.querySelectorAll(`[data-fav="${id}"]`).forEach((el) => {
      el.setAttribute('aria-pressed', on);
      el.textContent = on ? '★' : '☆';
    });
    if ($('#drawer').classList.contains('open')) return;
    // 一覧の途中で押されても位置が飛ばないようにする
    if (state.view === 'nushi') renderNushi(true); else render();
    return;
  }
  if (e.target.closest('[data-favall]')) {
    // いま画面に出ているぶんだけをまとめて★にする（絞り込みと併用できる）
    document.querySelectorAll('.nrow[data-fish]').forEach((r) => state.favs.add(Number(r.dataset.fish)));
    syncHash(); renderNushi(true); return;
  }
  if (e.target.closest('[data-favclear]')) { state.favs.clear(); syncHash(); renderNushi(true); return; }
  const cg = e.target.closest('[data-caught]');
  if (cg) {
    e.stopPropagation();
    const id = Number(cg.dataset.caught);
    state.caught.has(id) ? state.caught.delete(id) : state.caught.add(id);
    store.save(state.caught);
    const on = state.caught.has(id);
    document.querySelectorAll(`[data-caught="${id}"]`).forEach((el) => {
      el.setAttribute('aria-pressed', on);
      el.textContent = on ? '✔' : '□';
    });
    document.querySelector(`.fishrow[data-fish="${id}"]`)?.classList.toggle('done', on);
    document.querySelector(`.nrow[data-fish="${id}"]`)?.classList.toggle('done', on);
    return;
  }
  if (e.target.closest('[data-caughtall]')) {
    // いま画面に出ている魚だけをまとめて釣獲済みにする
    document.querySelectorAll('[data-caught]').forEach((b) => state.caught.add(Number(b.dataset.caught)));
    store.save(state.caught);
    if (state.view === 'nushi') renderNushi(true); else renderSpot(true);
    return;
  }
  if (e.target.closest('[data-spotuncaught]')) {
    const sp = spotById.get(state.spotId);
    if (sp) { sp.fishes.forEach((id) => state.caught.delete(id)); store.save(state.caught); renderSpot(true); }
    return;
  }
  if (e.target.closest('[data-caughtclear]')) { state.caught.clear(); store.save(state.caught); renderNushi(); return; }
  const tl = e.target.closest('[data-tl]');
  if (tl) { e.preventDefault(); state.tlHours = Number(tl.dataset.tl); renderNushi(true); return; }
  const cb = e.target.closest('[data-cb]');
  if (cb) { state.chartBait = Number(cb.dataset.cb); renderSpot(true); return; }
  const cc = e.target.closest('[data-cc]');
  if (cc) { state.chartChum = cc.dataset.cc === '1'; renderSpot(true); return; }
  const nfk = e.target.closest('[data-nfk]');
  if (nfk) {
    const { nfk: key, nfv: val, nfm: multi } = nfk.dataset;
    if (multi === '1') {
      state.nf[key].has(val) ? state.nf[key].delete(val) : state.nf[key].add(val);
    } else {
      state.nf[key] = val;
      if (key === 'ex') state.nf.ver = 'all';   // 拡張を変えたらパッチの選択は外す
    }
    store.saveFilter(state.nf);
    renderNushi(true);
    return;
  }
  const nfc = e.target.closest('[data-nfclear]');
  if (nfc) {
    const [key, val] = nfc.dataset.nfclear.split(':');
    if (val !== undefined) state.nf[key].delete(val);
    else if (key === 'scope') state.nf.scope = 'nushi';
    else state.nf[key] = key === 'kind' || key === 'ex' || key === 'ver' ? 'all' : 'any';
    store.saveFilter(state.nf);
    renderNushi(true);
    return;
  }
  if (e.target.closest('[data-nfreset]')) {
    state.nf = { scope: 'nushi', kind: 'all', ex: 'all', ver: 'all', tug: new Set(), hookset: 'any',
                 lure: 'any', folklore: 'any', intuition: 'any', weather: 'any', band: 'any',
                 rare: 'any', status: new Set() };
    store.saveFilter(state.nf);
    renderNushi(true);
    return;
  }
  if (e.target.closest('#nfilter')) { state.nfOpen = !state.nfOpen; renderNushi(true); return; }

  const spotEl = e.target.closest('[data-spot]');
  if (spotEl) { selectSpot(spotEl.dataset.spot); return; }
  const fishEl = e.target.closest('[data-fish]');
  if (fishEl) {
    const sid = fishEl.dataset.fishspot ? Number(fishEl.dataset.fishspot) : state.spotId;
    openFish(Number(fishEl.dataset.fish), sid);
    return;
  }
  if (e.target.closest('.drawer .close') || e.target.id === 'scrim') closeDrawer();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeDrawer(); }
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Enter' && e.target.classList?.contains('fishrow')) {
    openFish(Number(e.target.dataset.fish), state.spotId);
  }
});

/** URL から画面の状態を組み直す（戻る／進む・直リンク用） */
function applyRoute() {
  const h = location.hash;
  const m = h.match(/^#spot\/(\d+)/);
  if (h.startsWith('#nushi')) { state.view = 'nushi'; state.spotId = null; }
  else if (h.startsWith('#ocean')) { state.view = 'ocean'; state.spotId = null; }
  else if (m && spotById.has(Number(m[1]))) {
    state.view = 'spot';
    state.spotId = Number(m[1]);
    const sp = spotById.get(state.spotId);
    state.openAreas.add(sp.area.ja);
    state.openEx.add(String(sp.ex));
  } else { state.view = 'welcome'; state.spotId = null; }

  const fi = h.match(/[&|]fish=(\d+)/);
  state.query = '';
  $('#q').value = '';
  renderSide();
  render();
  if (fi && DB.fish[fi[1]]) openFish(Number(fi[1]), state.spotId);
  else closeDrawer();
}
window.addEventListener('popstate', applyRoute);

/* ══════════════════════════════════════════════════════════
   起動
   ══════════════════════════════════════════════════════════ */
(function init() {
  state.caught = store.load();
  const savedNf = store.loadFilter();
  if (savedNf) state.nf = { ...state.nf, ...savedNf };
  // ハッシュ指定が無ければブラウザの言語に寄せる
  const pref = (navigator.languages ?? [navigator.language ?? 'ja']).map((x) => x.slice(0, 2));
  const hit = pref.find((x) => LANGS.some((l) => l.id === x));
  if (hit) state.lang = hit;
  readHash();
  if (location.hash.startsWith('#nushi')) state.view = 'nushi';
  if (location.hash.startsWith('#ocean')) state.view = 'ocean';
  const m = location.hash.match(/spot\/(\d+)/);
  if (m && spotById.has(Number(m[1]))) {
    state.view = 'spot';
    state.spotId = Number(m[1]);
    const sp = spotById.get(state.spotId);
    state.openAreas.add(sp.area.ja);
    state.openEx.add(String(sp.ex));
  }
  // 条件未収録のヌシは、前提魚から実効条件を組み立てておく
  for (const f of Object.values(DB.fish)) f.derived = deriveCond(f);
  // ヘッダは折り返しで高さが変わるので、実測してサイドバーの起点に使う
  const syncHeaderHeight = () => {
    const h = document.querySelector('header')?.offsetHeight;
    if (h) document.documentElement.style.setProperty('--header-h', `${h}px`);
  };
  syncHeaderHeight();
  window.addEventListener('resize', syncHeaderHeight);
  if (window.ResizeObserver) new ResizeObserver(syncHeaderHeight).observe(document.querySelector('header'));

  renderChrome();
  renderSide();
  render();
  drawRing();
  setInterval(() => { drawRing(); tickCountdowns(); updateTitle(); updateMobar(); }, 1000);
  notify.check();
  setInterval(() => notify.check(), 20000);
  if (state.pendingFish) openFish(state.pendingFish, state.spotId);
  // ET が1時間進むごとに表示を更新（天候・出現状況が変わるため）
  // 表示中の内容は時間で変わるので定期的に描き直す
  setInterval(() => {
    if (state.query.trim()) return;
    if (state.view === 'nushi') renderNushi(true);
    else if (state.view === 'ocean') renderOcean();
    else if (state.spotId) renderSpot(true);
  }, 60 * 1000);
})();
  // ヒットタイムが遅れて届いたときに差し込む
  return function applyBite(bite) {
    DB.bite = bite;
    for (const [key, rec] of Object.entries(bite)) {
      const [sp, fi, ba] = key.split(':').map(Number);
      if (!biteIndex.has(sp)) { biteIndex.set(sp, new Map()); biteBaitTotals.set(sp, new Map()); }
      const m = biteIndex.get(sp);
      if (!m.has(fi)) m.set(fi, []);
      m.get(fi).push({ baitId: ba, ...rec });
      const t = biteBaitTotals.get(sp);
      t.set(ba, (t.get(ba) ?? 0) + rec.n);
    }
    for (const m of biteIndex.values()) for (const arr of m.values()) arr.sort((a, b) => b.n - a.n);
    DB.meta.biteTimeCount = Object.keys(bite).length;
    render();
  };
}

/* ── 読み込み ─────────────────────────────────────────── */
const stage = document.getElementById('stage');
const showError = (msg) => {
  stage.innerHTML = `<div class="empty"><h2>データを読み込めませんでした</h2>
    <p>${msg}</p>
    <ul><li>ページを再読み込みしてみてください</li>
        <li>ローカルのファイルを直接開いている場合は、単体版（standalone.html）をお使いください</li></ul></div>`;
};

if (INLINE_DATA) {
  startApp(INLINE_DATA);
} else {
  stage.innerHTML = `<div class="empty"><span class="eyebrow">LOADING</span>
    <h2 style="margin-top:8px">読み込み中…</h2>
    <p>釣り場と魚のデータを取得しています。</p></div>`;
  fetch(DATA_URLS.core)
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then((core) => {
      core.bite = {};
      const applyBite = startApp(core);
      // ヒットタイムは後追い。失敗しても本体は動く。
      fetch(DATA_URLS.bite)
        .then((r) => (r.ok ? r.json() : null))
        .then((b) => b && applyBite(b))
        .catch(() => {});
    })
    .catch((e) => showError(`取得に失敗しました（${e.message}）。`));
}
</script>
