name: ビルドと公開

on:
  # 毎週月曜の正午（JST）に上流データを取り直す
  schedule:
    - cron: '0 3 * * 1'
  # 手動実行。パッチ直後はこれを押すのが早い
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # リポジトリの Settings → Secrets and variables → Actions → Variables で
      # SITE_URL を設定する。未設定でもビルドは通る（OGP の絶対URLが省かれるだけ）。
      SITE_URL: ${{ vars.SITE_URL }}
      # アイコンを出さないなら Variables に ICONS = off を追加する
      ICONS: ${{ vars.ICONS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: ヒットタイムの実測を取り込む
        run: node tools/import-bite-times.mjs
        continue-on-error: true

      - name: サイトを生成
        run: node tools/build.mjs --refresh

      - name: データの更新をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bite-times.json
          git diff --staged --quiet && echo "変更なし" && exit 0
          git commit -m "chore: 上流データを反映"
          git push

      # GitHub Pages で公開する場合のみ。Cloudflare Pages を使うなら不要。
      - uses: actions/configure-pages@v5
        if: vars.DEPLOY_GITHUB_PAGES == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.DEPLOY_GITHUB_PAGES == 'true'
        with: { path: dist }

  deploy:
    needs: build
    if: vars.DEPLOY_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
