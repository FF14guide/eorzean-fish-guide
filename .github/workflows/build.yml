name: ビルドと公開

on:
  # 毎日正午（JST）に上流データを取り直す。
  # ヌシの条件やヒットタイムは上流が随時直しているので、日次で追いかける。
  schedule:
    - cron: '0 3 * * *'
  # 手動実行。パッチ直後はこれを押すのが早い
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # リポジトリの Settings → Secrets and variables → Actions → Variables で
      # SITE_URL を設定する。未設定でもビルドは通る（OGP の絶対URLが省かれるだけ）。
      SITE_URL: ${{ vars.SITE_URL }}
      # アイコンを出さないなら Variables に ICONS = off を追加する
      ICONS: ${{ vars.ICONS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: ヒットタイムの実測を取り込む
        run: node tools/import-bite-times.mjs
        continue-on-error: true

      - name: サイトを生成
        run: node tools/build.mjs --refresh

      # 上流データの一時欠損や形式変更で、ヌシ／オオヌシの釣り方が空のまま
      # 公開されることを防ぐ。失敗時はこの後の公開を行わない。
      - name: ヌシ・オオヌシの自動更新を検査
        run: node tools/validate-bigfish.mjs

      # 生成データはリポジトリに置かない（毎ビルドで作り直す）ので、コミットは不要。
      # 日次のスケジュール実行そのものが再ビルドのきっかけになる。

      # Cloudflare Workers（wrangler.jsonc の静的アセット）へ直接公開する。
      # 事前に Actions の Variables へ DEPLOY_CLOUDFLARE_WORKER=true、
      # Secrets へ CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID を設定した場合だけ実行する。
      - name: Cloudflare Workers へ自動公開
        if: vars.DEPLOY_CLOUDFLARE_WORKER == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # GitHub Pages で公開する場合のみ。Cloudflare Workers を使うなら不要。
      - uses: actions/configure-pages@v5
        if: vars.DEPLOY_GITHUB_PAGES == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.DEPLOY_GITHUB_PAGES == 'true'
        with: { path: dist }

  deploy:
    needs: build
    if: vars.DEPLOY_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
